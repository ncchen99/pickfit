<!doctype html>
<!-- The share card (og:image), 1200 × 630, in the site's paper theme. Rendered to PNG by render.sh; ?lang=zh gives the zh-TW card. -->
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Bricolage;src:url(../../worker/public/assets/fonts/bricolage-grotesque.woff2) format("woff2");font-weight:200 800}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  --paper:#F7F7F4;--tag:#FFFFFF;--rule:#DEDFD9;--ink:#1A1D17;--ink-2:#4F5149;--ink-3:#65655E;
  --tape:#F5C243;--tape-edge:#A57710;--tape-ink:#3A2905;--stitch:#C4552D;--fitz-line:#4A2E22;--pass:#2E7A35;
  font-family:Bricolage,"PingFang TC","Noto Sans TC",system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(ellipse 46% 62% at 84% 46%,rgb(169 188 76/.20),transparent 72%),
    linear-gradient(rgb(26 29 23/.045) 1px,transparent 1px) 0 0/30px 30px,
    linear-gradient(90deg,rgb(26 29 23/.045) 1px,transparent 1px) 0 0/30px 30px,
    var(--paper);
  position:relative;
}
.copy{position:absolute;left:72px;top:60px;width:700px}
.brand{display:flex;align-items:center;gap:14px;font:800 40px/1 Bricolage;letter-spacing:-.03em}
.brand img{width:48px;height:48px}
.i-dot{position:relative}
.i-dot::after{content:"";position:absolute;left:50%;top:.02em;width:.26em;height:.26em;border-radius:50%;background:var(--stitch);transform:translateX(-50%);box-shadow:0 0 0 .07em var(--paper)}
h1{margin-top:52px;font:800 88px/.98 Bricolage;letter-spacing:-.035em}
h1 em{font-style:normal;position:relative;z-index:0;white-space:nowrap}
/* measuring tape under the words that matter, like the tape round Fitz's neck */
h1 em::after{content:"";position:absolute;z-index:-1;left:-6px;right:-10px;bottom:2px;height:26px;background:var(--tape);
  background-image:repeating-linear-gradient(90deg,var(--tape-edge) 0 2px,transparent 2px 14px);background-size:100% 9px;background-repeat:no-repeat;
  border-radius:3px;transform:rotate(-1.2deg)}
.zh h1{font-size:76px;line-height:1.2;letter-spacing:.01em}
.zh h1 em::after{bottom:6px}
/* the search box from the home page: "I need …" over a ruler, filters, the yellow button */
.need{margin-top:46px;width:668px;background:var(--tag);border:3px solid var(--fitz-line);padding:22px 24px 20px;
  clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%);box-shadow:0 14px 30px rgb(26 29 23/.10)}
.need .q{font:600 27px/1.2 Bricolage;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.need .q b{color:var(--ink);font-weight:700;margin-right:12px}
.ticks{margin-top:14px;height:14px;border-bottom:2px solid var(--tape-edge);
  background:repeating-linear-gradient(90deg,var(--tape-edge) 0 2px,transparent 2px 64px) 0 0/100% 14px no-repeat,
             repeating-linear-gradient(90deg,var(--tape-edge) 0 1.5px,transparent 1.5px 8px) 0 7px/100% 7px no-repeat}
.row{margin-top:16px;display:flex;align-items:center;gap:10px}
.chip{font:600 19px/1 Bricolage;padding:9px 15px;border-radius:999px;border:2px solid var(--ink-3);color:var(--ink)}
.go{margin-left:auto;font:700 22px/1 Bricolage;padding:14px 24px;background:var(--tape);border:2px solid var(--tape-edge);border-radius:4px;color:var(--tape-ink)}
/* the answer: a result tag with pickfit's three checks, Fitz standing on it */
.fitz{position:absolute;right:92px;top:34px;width:330px;height:330px;filter:drop-shadow(0 16px 22px rgb(74 46 34/.16))}
.card{position:absolute;right:58px;top:352px;width:372px;background:var(--tag);border:3px solid var(--fitz-line);border-radius:6px;padding:20px 24px 18px;
  transform:rotate(1.8deg);box-shadow:0 16px 30px rgb(26 29 23/.14)}
.card::before{content:"";position:absolute;left:-3px;right:-3px;top:-3px;height:12px;background:var(--stitch);border-radius:6px 6px 0 0;
  border:3px solid var(--fitz-line);border-bottom:0}
.card h2{margin-top:6px;font:800 30px/1.1 Bricolage;letter-spacing:-.02em}
.card ul{list-style:none;padding:0;margin-top:12px;display:grid;gap:9px}
.card li{display:flex;align-items:center;gap:11px;font:600 21px/1.15 Bricolage;color:var(--ink-2)}
.card li::before{content:"✓";flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pass);color:#fff;font:800 17px/1 system-ui}
.zh .card li{font-size:21px}
</style>
</head>
<body>
<div class="copy">
  <div class="brand"><img src="../mascot/icons/fitz-64.svg" alt=""><span>pickf<span class="i-dot">i</span>t</span></div>
  <h1 data-en="Every tool,<br><em>tested first.</em>" data-zh="推薦的軟體<br><em>先試過了</em>"></h1>
  <div class="need">
    <div class="q" data-en="<b>I need</b>a free way to transcribe meetings offline" data-zh="<b>我需要</b>免費離線轉錄會議錄音"></div>
    <div class="ticks"></div>
    <div class="row" data-en="Free|Offline|Data stays local|Find tools" data-zh="免費|不需網路|資料在本地|幫我挑"></div>
  </div>
</div>
<img class="fitz" src="../mascot/states/fitz-success.svg" alt="">
<div class="card">
  <h2 data-en="Tested by pickfit" data-zh="pickfit 實測"></h2>
  <ul data-en="Installed in a sandbox|Features checked|Replayed offline" data-zh="在沙盒裡裝過|功能逐項測過|斷網重跑通過"></ul>
</div>
<script>
const zh = new URLSearchParams(location.search).get('lang') === 'zh';
if (zh) document.body.classList.add('zh');
document.documentElement.lang = zh ? 'zh-Hant-TW' : 'en';
for (const el of document.querySelectorAll('[data-en]')) {
  const text = el.dataset[zh ? 'zh' : 'en'];
  if (el.classList.contains('row')) {
    const parts = text.split('|'), go = parts.pop();
    el.innerHTML = parts.map((t) => `<span class="chip">${t}</span>`).join('') + `<span class="go">${go}</span>`;
  } else if (el.tagName === 'UL') el.innerHTML = text.split('|').map((t) => `<li>${t}</li>`).join('');
  else el.innerHTML = text;
}
</script>
</body>
</html>
