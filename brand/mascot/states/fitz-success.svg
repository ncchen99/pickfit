<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 200" width="210" height="200" role="img" aria-labelledby="t d"><title id="t">Fitz, success</title><desc id="d">Fitz hops and flaps its wings next to a green check.</desc><style>.tail{transform-box:fill-box;transform-origin:90% 92%}.wing{transform-box:fill-box;transform-origin:50% 5%}.eye{transform-box:fill-box;transform-origin:50% 50%}.bird{transform-box:fill-box;transform-origin:50% 100%;animation:hop 1.8s cubic-bezier(.3,0,.4,1) infinite}.tail{animation:flick 1.8s ease-in-out infinite}.wing.l{animation:flapl 1.8s ease-in-out infinite}.wing.r{animation:flapr 1.8s ease-in-out infinite}.badge{transform-box:fill-box;transform-origin:50% 50%;animation:pop 1.8s ease-out infinite}.sparks{animation:fade 1.8s ease-in-out infinite}@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.05,.94)}35%{transform:translateY(-14px) scale(.97,1.04)}60%{transform:translateY(0) scale(1.04,.95)}72%{transform:translateY(0) scale(1,1)}}@keyframes flick{0%,100%{transform:rotate(0)}35%{transform:rotate(-10deg)}60%{transform:rotate(3deg)}}@keyframes flapl{0%,70%,100%{transform:rotate(0)}22%{transform:rotate(30deg)}36%{transform:rotate(8deg)}48%{transform:rotate(26deg)}}@keyframes flapr{0%,70%,100%{transform:rotate(0)}22%{transform:rotate(-30deg)}36%{transform:rotate(-8deg)}48%{transform:rotate(-26deg)}}@keyframes pop{0%,100%{transform:scale(1)}30%{transform:scale(1.15)}45%{transform:scale(.96)}}@keyframes fade{0%,100%{opacity:.4}35%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><clipPath id="fitz"><path d="M100 62 C 136 62, 163 98, 163 136 C 163 166, 136 186, 100 186 C 64 186, 37 166, 37 136 C 37 98, 64 62, 100 62 Z"/></clipPath></defs><ellipse class="shadow" cx="100" cy="194" rx="40" ry="3.6" fill="#4A2E22" opacity=".12"/><g class="bird"><g class="feet"><path d="M88 183 L88 191 M82 194 L88 191 L94 194 M88 191 L88 195.5" stroke="#4A2E22" stroke-width