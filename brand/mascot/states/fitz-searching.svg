<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="t d"><title id="t">Fitz, searching</title><desc id="d">Fitz tilts its head and looks left and right while searching.</desc><style>.tail{transform-box:fill-box;transform-origin:68% 92%}.eye{transform-box:fill-box;transform-origin:50% 50%}.bird{transform-box:fill-box;transform-origin:50% 100%;animation:tilt 3.2s ease-in-out infinite}.pupils{animation:look 3.2s ease-in-out infinite}.tail{animation:bob 3.2s ease-in-out infinite}.dot{animation:dot 1.2s ease-in-out infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes tilt{0%,100%{transform:rotate(0)}18%,38%{transform:rotate(-6deg)}60%,80%{transform:rotate(6deg)}}@keyframes look{0%,100%{transform:translateX(0)}18%,38%{transform:translateX(-3.5px)}60%,80%{transform:translateX(3.5px)}}@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><clipPath id="fitz-body"><ellipse cx="100" cy="126" rx="64" ry="57"/></clipPath></defs><ellipse class="shadow" cx="103" cy="193.5" rx="34" ry="3.6" fill="#4A2E22" opacity=".12"/><g class="bird"><g class="feet"><path d="M91 179 L89 192 M83.5 192.5 L95 192.5" stroke="#4A2E22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M113 179 L115 192 M109.5 192.5 L121 192.5" stroke="#4A2E22" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><g class="tail"><path d="M67 104 C 62 86, 52 67, 46 53 Q 40 36 55.5 33 Q 71 30 72 46 C 72.5 64, 76 84, 81 102 Z" fill="#7C9334" stroke="#4A2E22" stroke-width="4.5" stroke-linejoin="round"/><path d="M56.5 34 Q57.6 39.5 58 45" fill="none" stroke="#4A2E22" stroke-width="2.5" stroke-linecap="round"/></g><g class="body"><ellipse cx="100" cy="126" rx="6