<!doctype html>
<!-- The founder's LinkedIn banner, 1584 × 396 (LinkedIn's size), in the share card's paper theme (brand/og/og.html).
     The lower-left corner stays empty: LinkedIn puts the profile photo there. Rendered to PNG by render.sh. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Bricolage;src:url(../../worker/public/assets/fonts/bricolage-grotesque.woff2) format("woff2");font-weight:200 800}
*{box-sizing:border-box;margin:0}
html,body{width:1584px;height:396px;overflow:hidden}
body{
  --paper:#F7F7F4;--tag:#FFFFFF;--rule:#DEDFD9;--ink:#1A1D17;--ink-2:#4F5149;--ink-3:#65655E;
  --tape:#F5C243;--tape-edge:#A57710;--tape-ink:#3A2905;--stitch:#C4552D;--fitz-line:#4A2E22;--pass:#2E7A35;
  font-family:Bricolage,system-ui,sans-serif;color:var(--ink);position:relative;
  background:
    radial-gradient(ellipse 34% 80% at 86% 50%,rgb(169 188 76/.22),transparent 72%),
    linear-gradient(rgb(26 29 23/.045) 1px,transparent 1px) 0 0/30px 30px,
    linear-gradient(90deg,rgb(26 29 23/.045) 1px,transparent 1px) 0 0/30px 30px,
    var(--paper);
}
.copy{position:absolute;left:430px;top:52px;width:620px}
.brand{display:flex;align-items:center;gap:12px;font:800 34px/1 Bricolage;letter-spacing:-.03em}
.brand img{width:42px;height:42px}
.i-dot{position:relative}
.i-dot::after{content:"";position:absolute;left:50%;top:.02em;width:.26em;height:.26em;border-radius:50%;background:var(--stitch);transform:translateX(-50%);box-shadow:0 0 0 .07em var(--paper)}
h1{margin-top:24px;font:800 60px/1 Bricolage;letter-spacing:-.035em;white-space:nowrap}
h1 em{font-style:normal;position:relative;z-index:0}
/* the measuring tape under the words that matter, as on the share card */
h1 em::after{content:"";position:absolute;z-index:-1;left:-6px;right:-10px;bottom:1px;height:18px;background:var(--tape);
  background-image:repeating-linear-gradient(90deg,var(--tape-edge) 0 2px,transparent 2px 14px);background-size:100% 8px;background-repeat:no-repeat;
  border-radius:3px;transform:rotate(-1.2deg)}
.sub{margin-top:20px;font:600 24px/1.3 Bricolage;color:var(--ink-2)}
.url{margin-top:16px;display:inline-flex;align-items:center;gap:10px;font:700 24px/1 Bricolage;color:var(--ink);
  padding:10px 16px;background:var(--tag);border:2px solid var(--fitz-line);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.url::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--stitch)}
.fitz{position:absolute;right:282px;top:62px;width:228px;height:228px;filter:drop-shadow(0 14px 20px rgb(74 46 34/.16))}
.card{position:absolute;right:42px;top:96px;width:286px;background:var(--tag);border:3px solid var(--fitz-line);border-radius:6px;padding:16px 20px 16px;
  transform:rotate(1.8deg);box-shadow:0 14px 26px rgb(26 29 23/.14)}
.card::before{content:"";position:absolute;left:-3px;right:-3px;top:-3px;height:11px;background:var(--stitch);border-radius:6px 6px 0 0;border:3px solid var(--fitz-line);border-bottom:0}
.card h2{margin-top:6px;font:800 25px/1.1 Bricolage;letter-spacing:-.02em}
.card ul{list-style:none;padding:0;margin-top:12px;display:grid;gap:9px}
.card li{display:flex;align-items:center;gap:10px;font:600 19px/1.15 Bricolage;color:var(--ink-2)}
.card li::before{content:"✓";flex:none;display:grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--pass);color:#fff;font:800 15px/1 system-ui}
</style>
</head>
<body>
<div class="copy">
  <div class="brand"><img src="../mascot/icons/fitz-64.svg" alt=""><span>pickf<span class="i-dot">i</span>t</span></div>
  <h1>Every tool, <em>tested first.</em></h1>
  <p class="sub">Software picks for people and coding agents, installed and checked in a sandbox</p>
  <p class="url">pickfit.app</p>
</div>
<img class="fitz" src="../mascot/states/fitz-success.svg" alt="">
<div class="card">
  <h2>Tested by pickfit</h2>
  <ul><li>Installed in a sandbox</li><li>Features checked</li><li>Replayed offline</li></ul>
</div>
</body>
</html>
