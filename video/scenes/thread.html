{

// ---------------------------------------------------------------- helpers (pure functions of t)
const EO = gsap.parseEase(ease.out), EIO = gsap.parseEase(ease.io);

const lerp = (a, b, u) => a + (b - a) * u;

function fade(obj, a) {
  obj.visible = a > 0.003;
  obj.traverse((o) => {
    if (!o.material || o.userData.keepAlpha) return;
    for (const m of [].concat(o.material)) { m.transparent = a < 0.999 || !!m.userData.alpha; m.opacity = a * (m.userData.alpha ?? 1); }

}
// Entrance: short rise, scale from 0.94, opacity.
function enter(obj, base, p, { rise = 0.1, from = 0.94, axis = 'y' } = {}) {
  fade(obj, Math.min(1, p * 1.6));
  obj.scale.setScalar(from + (1 - from) * p);
  obj.position.copy(base);
  obj.position[axis] -= rise * (1 - p);
}
// Lay a card flat on the floor (face up), with an in-plane turn.
function layFlat(card, x, z, turn = 0, y = 0.03) { card.rotation.set(-Math.PI / 2, 0, turn); card.position.set(x, y, z); return card; }

// Monotone cubic interpolation (no overshoot) of keyed values over time.
function pchip(xs, ys) {
  const n = xs.length, d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  for (let i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) m[i] = 0;
    else {
      const h0 = xs[i] - xs[i - 1], h1 = xs[i + 1] - xs[i];
      const w1 = 2 * h1 + h0, w2 = h1 + 2 * h0;
      m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
    }
  }
  m[0] = 0; m[n - 1] = 0;
  return (x) => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0;
    while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], s = (x - xs[i]) / h, s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * ys[i] + (s3 - 2 * s2 + s) * h * m[i] + (-2 * s3 + 3 * s2) * ys[i + 1] + (s3 - s2) * h * m[i + 1];
  };
}

// A paper tag: punched hole, a small caption, the model (or actor) in display type, an extra.
function tagCard({ caption, name, extra = '', w = 1.5, h = 0.4, ppu = 400 }) {

  } });
}
// A tent card standing on the floor, leaning back a little, turned to face a point.
function tent(card, h, x, z, face, lean = 0.22) {
  const g = new THREE.Group();
  card.rotation.x = -lean;
  card.position.set(0, (h / 2) * Math.cos(lean), -(h / 2) * Math.sin(lean));
  g.add(card);
  g.position.set(x, 0, z);
  g.rotation.y = Math.atan2(face.x - x, face.z - z);
  scene.add(g);
  return g;
}

// ---------------------------------------------------------------- the wall layout (needed first: the thread ends there)
const TKW = 0.26, TKD = 0.17, PX = 0.30, PZ = 0.21, ROWS = 12;
const ROWZ = [-18.75, -22.7];

  { name: 'Web apps', n: 90, v: 85, row: 0, x0: 0.9 },
  { name: 'Other', sub: 'servers · terminal · self-hosted · extension', n: 149, v: 73, row: 0, x0: 4.2 },
  { name: 'CLI tools', n: 335, v: 250, row: 1, x0: -5.7 },
  { name: 'MCP servers', n: 194, v: 129, row: 1, x0: 3.6 },
];
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const tickets = []; // { x, z, verified, mango }
for (const g of groups) {
  g.cols = Math.ceil(g.n / ROWS);
  g.w = g.cols * PX;
  g.cx = g.x0 + g.w / 2;
  const order = Array.from({ length: g.n }, (_, i) => i);
  for (let i = g.n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const verified = new Set(order.slice(0, g.v));
  for (let i = 0; i < g.n; i++) {
    const col = i % g.cols, r = Math.floor(i / g.cols);
    const mango = g.name === 'Desktop apps' && r === 0 && col === g.cols - 1;
    tickets.push({ x: g.x0 + col * PX + PX / 2, z: ROWZ[g.row] - r * PZ - PZ / 2, verified: mango || verified.has(i), mango, g });
  }
  // keep the verified count exact even if MangoDisk's slot was not in the sample
  const mt = tickets.find((k) => k.mango && k.g === g);
  if (mt && !verified.has(g.cols - 1)) { const other = tickets.find((k) => k.g === g && k.verified && !k.mango); other.verified = false; }
}
const MANGO = tickets.find((k) => k.mango);

// ---------------------------------------------------------------- the thread

const GATE = new THREE.Vector3(0.33, 0, -7.6);
function gateCard() {
  const W = 1.5, H = 0.92, sw = 0.9, sh = 0.2, depth = 0.045, ppu = 400;
  const s = new THREE.Shape();
  s.moveTo(-W / 2, 0); s.lineTo(-sw / 2, 0); s.lineTo(-sw / 2, sh); s.lineTo(sw / 2, sh); s.lineTo(sw / 2, 0);
  s.lineTo(W / 2, 0); s.lineTo(W / 2, H); s.lineTo(-W / 2, H); s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.004, bevelSegments: 2 });
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + W / 2) / W, pos.getY(i) / H);
  geo.translate(0, 0, -depth / 2);
  const pw = W * ppu, ph = H * ppu;
  const tex = canvasTexture(pw, ph, (ctx) => {
    ctx.fillStyle = site.raised; ctx.fillRect(0, 0, pw, ph);
    ctx.strokeStyle = site.rule; ctx.lineWidth = 4; ctx.strokeRect(2, 2, pw - 4, ph - 4);
    text(ctx, 'prescreen', pw / 2, 120, { size: 64, weight: 700, family: fonts.display, align: 'center' });

    ctx.fillStyle = site.rule; ctx.fillRect((W - sw) / 2 * ppu - 3, ph - sh * ppu - 3, sw * ppu + 6, 3);
  });

  mesh.castShadow = mesh.receiveShadow = true;
  return mesh;
}

});

function onFlat(card, w, h, ppu, px, py, y = 0.05) {

}), -0.78, -16.0);
const browser = frameGroup(frameCard('sandboxed browser', '', (ctx, x, y, w) => {
  ctx.fillStyle = site.raised; ctx.beginPath(); ctx.roundRect(x + 24, y + 22, w - 48, 40, 20); ctx.fill();

}), 3.78, -16.0);
const macCard = frameCard('fresh macOS VM', '18:30 → 18:48');
const mac = frameGroup(macCard, 1.5, -16.0);
const MAC_FWD = { z: -15.3, s: 1.12 };

// the VM's screen: 1280 x 800 pixels, drawn on a lit-up plane inside the frame

const vm = (px, py, z = 0.012) => new THREE.Vector3((px / VW - 0.5) * SW, SCY + (0.5 - py / VH) * SH, z);
const ROW0 = 214, ROWSTEP = 54, CB = { x: 232, y: 214 };

const FILES = [['big-video-mangodisk.mov', '150 MB'], ['archive-2024.zip', '88 MB'], ['screen-recording.mov', '61 MB'], ['installer-old.dmg', '45 MB'], ['photos-backup.tar', '38 MB']];
function chrome(ctx, x, y, w, h, title) {
  ctx.fillStyle = site.raised; ctx.strokeStyle = site.rule; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle = site.sunk; ctx.beginPath(); ctx.roundRect(x + 1, y + 1, w - 2, 46, [12, 12, 0, 0]); ctx.fill();
  ctx.fillStyle = site.rule; ctx.fillRect(x, y + 46, w, 2);
  for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x + 26 + i * 24, y + 23, 7, 0, Math.PI * 2); ctx.fill(); }
  text(ctx, title, x + w / 2, y + 31, { size: 21, weight: 600, align: 'center', color: site.ink2 });
}
function checkbox(ctx, cx, cy, s, on) {

  ctx.beginPath(); ctx.roundRect(cx - s / 2, cy - s / 2, s, s, s / 5);
  if (on) {
    ctx.fillStyle = site.pass; ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = s / 7; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(cx - s * 0.26, cy + s * 0.02); ctx.lineTo(cx - s * 0.06, cy + s * 0.22); ctx.lineTo(cx + s * 0.28, cy - s * 0.2); ctx.stroke();
  } else { ctx.fillStyle = site.raised; ctx.fill(); ctx.strokeStyle = site.lineCtl; ctx.stroke(); }
}

  ctx.fillStyle = site.sunk; ctx.fillRect(0, 0, VW, 26);
  ctx.fillStyle = site.rule; ctx.fillRect(0, 26, VW, 2);
  if (st.mode === 'install') {
    chrome(ctx, 150, 140, 980, 520, 'Terminal');
    const L = ['$ brew install --cask --appdir=~/Applications mangodisk', '==> Downloading MangoDisk 1.2.2', '==> Installing Cask mangodisk', '✓ MangoDisk.app installed'];
    L.slice(0, st.lines).forEach((s, i) => text(ctx, s, 190, 250 + i * 64, { size: 27, family: fonts.mono, color: i === 3 ? site.pass : site.ink }));
  } else if (st.mode === 'features') {
    chrome(ctx, 150, 110, 980, 600, 'MangoDisk');
    text(ctx, 'Four features', 210, 206, { size: 30, weight: 700, color: site.ink3 });
    FEATURES.forEach((f, i) => {
      const y = 300 + i * 96;
      if (i > 0) { ctx.fillStyle = site.sunk; ctx.fillRect(210, y - 50, 860, 2); }
      checkbox(ctx, 236, y - 11, 40, i < st.ticks);
      text(ctx, f, 284, y, { size: 36, color: site.ink });
    });
  } else if (st.mode === 'list') {
    chrome(ctx, 120, 90, 1040, 640, 'MangoDisk');

    browser.position.set(3.78 + 0.35 * dimL, 0, -16.0 - 0.6 * dimL);
    const lnp = ramp(t, 13.0, 0.6);
    enter(linuxNoteCard, linuxNote.userData.cb ??= linuxNoteCard.position.clone(), lnp, { rise: 0.05 });
    fade(linuxNote, Math.min(1, lnp * 1.6) * (1 - 0.45 * dimL));
    // the screen
    const on = ramp(t, 14.35, 0.5);
    screen.material.opacity = on;
    screen.visible = on > 0.003;
    let st;
    if (t < 15.5) st = { mode: 'desktop' };
    else if (t < 17.8) st = { mode: 'install', lines: t < 15.6 ? 0 : t < 16.05 ? 1 : t < 16.5 ? 2 : t < 17.0 ? 3 : 4 };
    else if (t < 22.65) st = { mode: 'features', ticks: [18.45, 19.05, 19.65, 20.25].filter((x) => t >= x).length };
    else st = { mode: 'list', checked: t >= 26.3 };
    redrawIf(screenTex, 'sk', JSON.stringify(st), (ctx) => drawScreen(ctx, st));
    // the tags: installed (15.5), operated (17.8), checked (20.7)
    [15.5, 17.8, 20.7].forEach((ta, i) => {
      const p = ramp(t, ta, 0.6);
      const m = macTags[i];
      fade(m, Math.min(1, p * 1.6) * (1 - ramp(t, 22.45, 0.5)));
      m.scale.setScalar(0.8 * (0.94 + 0.06 * p));
      m.position.copy(macTagBase[i]); m.position.x -= 0.08 * (1 - p);
    });
    macStitch.userData.progress(ramp(t, 20.75, 0.8, EIO));
    // the operator's pointer visits each feature row and clicks
    const ticksAt = [18.45, 19.05, 19.65, 20.25];
    let px = 1000, py = 700, pa = 0;
    if (t >= 17.85 && t < 22.6) {
      pa = clamp01((t - 17.85) / 0.25) * (1 - clamp01((t - 20.7) / 0.3));
      const rowY = (i) => 300 + i * 96 - 11;
      let from = [1000, 700];
      for (let i = 0; i < 4; i++) {
        const a = ticksAt[i] - 0.45, b = ticksAt[i] - 0.05;
        const to = [236 + 6, rowY(i) + 4];
        if (t < a) break;
        const u = ramp(t, a, b - a, EIO);
        px = lerp(from[0], to[0], u); py = lerp(from[1], to[1], u);
        from = to;
      }
      if (t < ticksAt[0] - 0.45) { px = 1000; py = 700; }
    }
    pointer.visible = pa > 0.003;
    pointer.children.forEach((c) => (c.material.opacity = pa));
    pointer.position.copy(vm(px, py, 0.02));
    const click = ticksAt.reduce((acc, x) => acc + Math.max(0, 1 - Math.abs(t - x) / 0.08), 0);
    pointer.scale.setScalar(1 - 0.12 * Math.min(1, click));
  }

  // --- station 5: the miss, measured; zoom 4x; aim again
  {
    const land = ramp(t, 23.75, 0.45);
    const gone = ramp(t, 26.25, 0.3);
    miss.visible = land > 0.003 && gone < 0.997;
    miss.userData.mat.opacity = Math.min(1, land * 1.6) * (1 - gone);
    miss.position.copy(MISS_PT);
    miss.scale.setScalar(lerp(1.4, 1, land));
    const dimA = ramp(t, 24.15, 0.4) * (1 - ramp(t, 26.25, 0.3));
    dim.material.opacity = dimA; dim.visible = dimA > 0.003;
    const lp = ramp(t, 24.75, 0.6);
    const lensOut = ramp(t, 28.6, 0.4);
    fade(lens, Math.min(1, lp * 1.6) * (1 - lensOut));
    lensFace.material.transparent = true;
    lens.position.copy(LENS_C); lens.position.z = lerp(0.03, LENS_C.z, lp);
    lens.scale.setScalar(lerp(0.94, 1, lp));
    const ca = Math.min(1, lp * 1.6) * (1 - lensOut);
    srcRing.material.opacity = ca; srcRing.visible = ca > 0.003;
    connectors.children.forEach((c) => (c.material.opacity = ca)); connectors.visible = ca > 0.003;
    const lensChecked = t >= 26.3;
    redrawIf(lensTex, 'lk', String(lensChecked), (ctx) => drawLens(ctx, lensChecked));
    // the aim inside the lens: starts where the click landed, moves to dead centre, turns green
    const move = ramp(t, 25.55, 0.65, EIO);
    aim.position.set(3 * LPX * (1 - move), -30 * LPX * (1 - move), 0.006);
    const good = t >= 26.22;
    aim.userData.mat.color.set(good ? site.pass : site.fail);
    aim.scale.setScalar(good ? 1 - 0.1 * Math.max(0, 1 - Math.abs(t - 26.3) / 0.1) : 1);
    // the result
    const hp = ramp(t, 26.65, 0.55);
    fade(hits, Math.min(1, hp * 1.6) * (1 - lensOut));
    hits.position.copy(HITS_POS); hits.position.y -= 0.03 * (1 - hp);
    hits.scale.setScalar(lerp(0.94, 1, hp));
    const n = Math.round(lerp(5, 13, ramp(t, 27.05, 0.6, (x) => x)));
    redrawIf(hits, 'hk', String(n), (ctx, w, h) => drawHits(ctx, w, h, n));
  }

  // --- station 6: the wall
  {
    const aA = tkGeo.attributes.aAlpha;
    let dirtyM = false;
    others.forEach((k, i) => {
      const p = ramp(t, k.appear, 0.45);
      const a = Math.min(1, p * 1.7);
      if (aA.array[i] !== a) { aA.array[i] = a; dirtyM = true; }
      tmpP.set(k.x, 0.006 + 0.22 * (1 - p), k.z);
      tmpS.setScalar(p > 0 ? 0.94 + 0.06 * p : 0.0001);
      tmpM.compose(tmpP, tmpQ, tmpS);
      wall.setMatrixAt(i, tmpM);
      const tint = k.verified ? 0 : ramp(t, 35.2 + 0.25 * (k.d / maxD), 0.4);
      wall.setColorAt(i, tmpColor.copy(white).lerp(quiet, tint));
    });
    aA.needsUpdate = true;
    wall.instanceMatrix.needsUpdate = true;
    wall.instanceColor.needsUpdate = true;
    wall.visible = t > 29.0;
    wallStitch.count = Math.round(verifiedOthers.length * ramp(t, 31.6, 1.3, (x) => x)) * 3;
    // labels
    labels.forEach((grp, i) => {
      const g = groups[i];
      const p = ramp(t, 29.7 + i * 0.12, 0.6);
      enter(grp, grp.userData.base, p, { rise: 0.15, axis: 'z' });
      const stg = t >= 35.2 + 0.08 * i ? 2 : t >= 31.75 + 0.1 * i ? 1 : 0;
      redrawIf(grp.userData.card, 'lk', String(stg), (ctx, w, h) => drawLabel(ctx, w, h, g, stg));
    });
    const cp = ramp(t, 29.15, 0.6);
    enter(counterG, COUNTER_BASE, cp, { rise: 0.2, axis: 'z' });
    const cn = Math.round(963 * ramp(t, 29.5, 1.2, gsap.parseEase('power2.out')));
    const cs = t >= 35.25 ? 2 : t >= 31.6 ? 1 : 0;
    redrawIf(counter, 'ck', cn + ':' + cs, (ctx, w, h) => drawCount(ctx, w, h, cn, cs));
    enter(mangoCallG, MCALL_BASE, ramp(t, 30.3, 0.6), { rise: 0.1, axis: 'z' });
  }
} });

</script>
