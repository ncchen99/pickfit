// a damped wobble that settles to 0 (for landings and slaps)
const wob = (t, t0, amp = 1, f = 16, d = 7) => (t < t0 ? 0 : amp * Math.exp(-d * (t - t0)) * Math.cos(f * (t - t0)));

function fadeable(obj, { glow = false } = {}) {
  const mats = [];
  obj.traverse((o) => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { if (!mats.includes(m)) mats.push(m); }); });
  const base = mats.map((m) => m.color ? m.color.clone() : null);
  if (glow) mats.forEach((m) => { if (m.emissive) { m.emissive.set('#ffffff'); if (m.map) m.emissiveMap = m.map; else m.emissive.copy(m.color); m.emissiveIntensity = 0; } });
  obj.userData.look = (opacity, dim = 0) => {
    mats.forEach((m, i) => {
      m.transparent = opacity < 0.999 || m.userData.alwaysTransparent;
      m.opacity = opacity;
      if (base[i]) m.color.copy(base[i]).multiplyScalar(1 - dim);
      if (glow && m.emissive) m.emissiveIntensity = paperGlow * (1 - dim) * (m.map ? 1 : 0.85);
    });
    obj.visible = opacity > 0.003;
  };
  obj.userData.look(0);
  return obj;
}

function setRibbon(len, held, flood, lift = 0) {
  // the path: flat along the desk edge, then (when held) rising to the beak
  const flatEnd = held ? cl(held.x - HELD_AHEAD - lift, RX0 + 0.004, RX0 + len) : RX0 + Math.max(0.004, len);
  const P0 = V(flatEnd, RY, RZ);
  const curve = held ? new THREE.QuadraticBezierCurve3(P0, V(flatEnd + 0.05, RY, RZ), held) : null;
  const Lf = flatEnd - RX0, Lc = curve ? curve.getLength() : 0, Lg = Lf + Lc;
  const n1 = curve ? Math.max(2, Math.round(NSEG * Lf / Lg)) : NSEG;
  const sF = Lg * (1 - flood);
  const half = B.RULER.width / 2;
  const p = V(), tan = V(), side = V(0, 0, 1);
  for (let i = 0; i <= NSEG; i++) {
    let s;
    if (i <= n1) { s = (i / n1) * Lf; p.set(RX0 + s, RY, RZ); }
    else { const u = (i - n1) / (NSEG - n1); curve.getPointAt(u, p); s = Lf + u * Lc; }
    for (let j = 0; j < 2; j++) {
      const o = (i * 2 + j);
      rPos[o * 3] = p.x; rPos[o * 3 + 1] = p.y; rPos[o * 3 + 2] = p.z + (j ? half : -half);
      rUv[o * 2] = s / FULL; rUv[o * 2 + 1] = j ? 0 : 1;
      const f = flood > 0 ? smooth(sF - 0.05, sF + 0.05, s) : 0;
      const c = [lerp(1, TAPE_LIN.r, f), lerp(1, TAPE_LIN.g, f), lerp(1, TAPE_LIN.b, f)];
      rCol[o * 3] = c[0]; rCol[o * 3 + 1] = c[1]; rCol[o * 3 + 2] = c[2];
    }
  }
  ribGeo.attributes.position.needsUpdate = true;
  ribGeo.attributes.uv.needsUpdate = true;
  ribGeo.attributes.color.needsUpdate = true;
  ribGeo.computeVertexNormals();
  ribGeo.computeBoundingSphere();
  tabDesk.visible = !held;
  tabDesk.position.set(RX0 + Math.max(0.004, len) + 0.008, RY + 0.012, RZ);
}

// ------------------------------------------------------------------ the story clock
// minutes after 7:00 PM as the night goes (tau = scene seconds)
const MIN_KEYS = [[7.0, 2], [7.7, 2], [11.6, 40], [14.7, 85], [19.8, 150], [22.1, 190], [26.0, 288]];
function minutesAt(tau) {
  if (tau <= MIN_KEYS[0][0]) return MIN_KEYS[0][1];
  for (let i = 1; i < MIN_KEYS.length; i++) {
    const [t1, m1] = MIN_KEYS[i], [t0, m0] = MIN_KEYS[i - 1];
    if (tau <= t1) return lerp(m0, m1, (tau - t0) / (t1 - t0));
  }
  return 288;
}
const fmt = (min) => {
  const tot = Math.round(19 * 60 + min);
  const h24 = Math.floor(tot / 60) % 24, mm = ((tot % 60) + 60) % 60;
  const h = ((h24 + 11) % 12) + 1;
  return `${h}:${String(mm).padStart(2, '0')} ${h24 >= 12 ? 'PM' : 'AM'}`;
};

// A smooth monotone curve through keys (Fritsch-Carlson); flat at local turns and at the end.
function monotone(pts, startSlope = 0.5) {
  const n = pts.length, xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  m[0] = d[0] * startSlope; m[n - 1] = 0;
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (d[i - 1] + d[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (d[i] === 0) { m[i] = 0; m[i + 1] = 0; continue; }
    const a = m[i] / d[i], b = m[i + 1] / d[i], q = a * a + b * b;
    if (q > 9) { const r = 3 / Math.sqrt(q); m[i] = r * a * d[i]; m[i + 1] = r * b * d[i]; }
  }

    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let i = 0;
    while (x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], u = (x - xs[i]) / h, u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h * m[i + 1];

// ------------------------------------------------------------------ the screen
function screenAt(tau, min, t) {
  let s;

  else if (tau < 11.6) {
    const q = 'free disk cleaner for mac';
    const n = Math.floor(q.length * seg(tau, 9.95, 11.2));
    s = { mode: 'search', typed: q.slice(0, n), caret: n < q.length ? true : Math.floor(tau * 2.5) % 2 === 0 };
  } else if (tau < 22.1) {
    s = { mode: 'tabs', tabs: Math.max(1, TAB_T.filter((x) => tau >= x).length) };
  } else {
    const lines = CODE_LINES(tau);
    s = { mode: 'code', lines: lines.n, partial: lines.partial, version: versionKey };
  }
  if (tau >= 25.85) s.alert = true;
  s.clock = fmt(min);
  if (t >= 33.15) s = { mode: 'desk', clock: fmt(MIN_END) };
  const key = JSON.stringify(s);
  if (key !== screenKey) { screenKey = key; screenTex.userData.redraw((ctx, w, h) => D.drawScreen(ctx, w, h, s)); }
}
function CODE_LINES(tau) {
  const u = seg(tau, 22.15, 25.7);
  const total = D.CODE.length;
  const x = Math.pow(u, 0.85) * total;
  const n = Math.min(total, Math.floor(x) + 1);
  return { n, partial: n >= total && u >= 1 ? null : x - Math.floor(x) };
}

  else if (t < REW_T0) { tau = 26.0; min = 288; }
  else {
    tau = rewTau(t);
    min = minutesAt(Math.max(tau, 7.0)) - Math.max(0, 7.0 - tau) * 25;
  }
  const N = lightAt(t);

  // disclosure
  const disc = t < 7.0;
  discCard.visible = disc;
  room.visible = !disc;
  if (disc) {
    aimKey(V(0, 0.6, DZ), 6);
    const inU = k(t, 0.0, 0.75, EO);
    discCard.position.y = 0.68 - 0.05 * (1 - inU);
    discCard.scale.setScalar(lerp(0.96, 1, inU));
    discOverlays[0].material.opacity = k(t, 0.12, 0.7, EO);
    const l2 = k(t, 4.1, 4.6, EO);
    discOverlays[1].material.opacity = l2;
    discOverlays[1].position.y = -0.2 - 0.035 * (1 - l2);
  } else if (t < PUSH_T0) {
    aimKey(V(0.3, 1.0, 0.1), 4.2);
  } else {
    aimKey(SC, lerp(4.2, 1.6, seg(t, PUSH_T0, 34.3)), lerp(0.02, 0.002, seg(t, PUSH_T0, 34.3)));
  }

  // the clock
  const secs = t < REW_T0 ? Math.floor(t) % 60 : 60 - ((t - REW_T0) * 140) % 60;
  clock.setTime(min, secs);

  // the person
  {
    // While the evening plays backwards the person only sits up: replaying the lean-back or the typing
    // at speed reads as a jolt, and that gesture has nothing to say on the way back.
    const rewinding = t >= REW_T0;
    const { p, typing } = rewinding ? { p: POSES.type, typing: 0 } : poseTau(tau);
    const slump = t < REW_T0 ? k(t, 26.05, 27.15, EIO) : 1 - k(t, 30.25, 30.95, EIO);
    setPose(mixPose(p, POSES.slump, slump), typing * (1 - slump), tau);
  }

  const popped = propsAt(tau, t);
  screenAt(tau, min, t);

  // Fitz
  let held = null, flood = 0, lift = 0;
  const fzOn = t >= LAND_T0;
  fz.root.visible = fzOn;
  if (!fzOn) fzLight.intensity = 0;
  if (fzOn) {
    const endX = RX0 + (288 / 60) * B.RULER.perHour;
    const landX = endX - 0.23;
    const land = V(landX, B.DESK.top, FZ_Z);
    let pos = V(), flap = 0, pitch = 0, sq = 1, hop = 0, roll = 0, face = FACE_CAM;
    if (t < LAND_T) {
      const u = seg(t, LAND_T0, LAND_T);
      const start = V(landX + 1.0, B.DESK.top + 3.7, FZ_Z - 0.5);
      const ctrl = V(landX + 0.25, B.DESK.top + 1.2, FZ_Z - 0.1);
      new THREE.QuadraticBezierCurve3(start, ctrl, land).getPoint(P2O(u), pos);
      flap = 0.5 + 0.5 * Math.sin(t * 2 * Math.PI * 7.5);
      pitch = 0.25 * (1 - u);
      sq = 1.06;
    } else {
      pos.copy(land);
      sq = 1 - wob(t, LAND_T, 0.17, 20, 7);
      flap = 0.5 * (1 - seg(t, LAND_T, LAND_T + 0.25));
      // he lands facing us, turns to the tape end and pecks it up
      face = lerp(FACE_CAM, FACE_END, k(t, 29.1, 29.35, EO));
      pitch = 0.3 * Math.sin(Math.PI * seg(t, 29.3, 29.6));
      if (t >= GRAB_T) held = true;
      flood = k(t, 29.45, 29.85, EO);
      // then turns his back to us, the tape end in his beak, toward the person at the desk
      face = lerp(face, FACE_RUN, k(t, 29.62, 30.05, EIO));
      // a crouch, and he runs: the evening reels in ahead of him while it plays backwards
      sq -= 0.09 * Math.sin(Math.PI * seg(t, 29.95, 30.3));
      if (t >= REW_T0) {
        const toX = RX0 + (MIN_END / 60) * B.RULER.perHour + RUN_REACH + HELD_AHEAD;
        pos.x = lerp(landX, toX, pullAt(t));
        const u = seg(t, REW_T0, REW_T1);
        const run = Math.sin(Math.PI * cl(u * 1.05)), step = Math.sin(Math.PI * 11 * u);
        hop = Math.abs(step) * 0.07 * run;
        roll = 0.12 * step * run;
        pitch += 0.2 * run;
        flap = (0.25 + 0.25 * Math.sin(t * 2 * Math.PI * 7)) * run;
        sq -= wob(t, REW_T1, 0.12, 18, 7);
        // stopped at 7:02, he looks back at us over his shoulder
        face = lerp(FACE_RUN, FACE_STOP, k(t, REW_T1 + 0.05, REW_T1 + 0.55, EO));
      }
    }
    fz.root.position.copy(pos);
    fz.root.rotation.y = face;
    fzLight.position.copy(pos).add(V(0.35, 0.55, 0.6));
    fzLight.intensity = 2.4 * k(t, LAND_T0, LAND_T, EO) * N;
    fz.bird.position.y = hop / FS;
    // pitch tips him toward where he faces; roll is the waddle of the run
    fz.bird.quaternion.setFromAxisAngle(V(1, 0, 0), pitch).multiply(tmpQ.setFromAxisAngle(V(0, 0, 1), roll));
    fz.flap(flap);
    fz.squash(sq);
    fz.turn(0);
    const bl = [29.05, 31.8, 33.55].some((b) => t > b && t < b + 0.12) ? 1 : 0;
    fz.blink(bl);
    tabHeld.visible = !!held;
    if (held) { fz.root.updateMatrixWorld(true); held = tabHeld.getWorldPosition(V()); }
  }
  const len = held ? 10 : Math.max(0.004, (min / 60) * B.RULER.perHour); // held: the tape follows Fitz
  setRibbon(len, held, flood, lift);
  ribbon.visible = !disc;

  // the end: the screen becomes the page; the request card, its tape, the wordmark, the stitched dot
  {
    const pageU = k(t, 33.25, 34.1, EIO);
    L.page.material.opacity = pageU;
    L.page.visible = pageU > 0.002;
    L.catcher.material.opacity = 0.16 * pageU;
    bleed.material.opacity = k(t, 34.6, 35.2, EIO);
    bleed.visible = bleed.material.opacity > 0.002;
    const cardU = k(t, 33.7, 34.4, EO);
    ask.position.z = lerp(0.006, 0.03, cardU);
    ask.scale.setScalar(lerp(0.94, 1, cardU));
    ask.userData.look(seg(t, 33.7, 34.0));
    const tapeU = k(t, 34.35, 35.25, EO);
    const tl = Math.max(0.0001, TAPE_LEN * tapeU);
    tapeStrip.scale.set(tl, TAPE_TH, 1);
    tapeStrip.position.x = -TAPE_LEN / 2 + tl / 2;
    tapeTex.repeat.set(tapeU || 0.0001, 1);
    tapeStrip.visible = tapeU > 0.001;
    const rr = 0.016 * (1 - tapeU) + 0.0001;
    roll.scale.set(rr, 1, rr);
    roll.position.set(-TAPE_LEN / 2 + tl + rr * 0.6, tapeStrip.position.y, 0.0062 + rr);
    roll.visible = tapeU > 0.001 && tapeU < 0.995;
    roll.rotation.y = 0;
    // the caret blinks once everything has landed
    caret.visible = (t > 36.95 && t < 37.5) || t > 37.72;

    const wmU = k(t, 35.25, 35.85, EO);
    wordmark.position.z = lerp(0.09, 0.0025, wmU);
    wordmark.scale.setScalar(lerp(1.05, 1, wmU));
    wordmark.userData.look(seg(t, 35.25, 35.55));
    // the dot of the i, sewn on with one stitch at about 36.5
    const sew = seg(t, 36.25, 36.62);
    const dotIn = t >= 36.5;
    const pop = dotIn ? 1 + wob(t, 36.5, 0.22, 24, 9) : 0;
    dotHolder.position.copy(wordmark.position).add(dotLocal.clone().multiplyScalar(wordmark.scale.x)).add(V(0, 0, 0.0035));
    dotHolder.scale.setScalar(Math.max(0.0001, pop));
    dotHolder.visible = dotIn;
    if (dotIn !== wmSewn) { wmSewn = dotIn; wmTex.userData.redraw((ctx, w, h) => D.drawWordmark(ctx, w, h, WM_SIZE, dotIn)); }
    // nothing but the page's own things casts on the page once the camera is in the screen
    const inScreen = t >= 34.6;
    if (inScreen !== castersOff) { castersOff = inScreen; CASTERS.forEach((o) => o.traverse((c) => { if (c.isMesh) c.castShadow = c.userData.cast0 && !inScreen; })); }
    if (sew > 0 && sew < 1) {
      // a thread comes down through the dot and pulls tight
      const c = dotHolder.position;
      const a = sew < 0.6 ? EO(sew / 0.6) : 1, pullT = sew < 0.6 ? 0 : EIO((sew - 0.6) / 0.4);
      const far = V(c.x + 0.11, c.y + 0.1, c.z + 0.12);
      const tip = far.clone().lerp(c, a);
      const tail = far.clone().lerp(c, pullT);
      const mid = tail.clone().lerp(tip, 0.5).add(V(0.02 * (1 - pullT), 0.03 * (1 - pullT), 0.02));
      const curve = new THREE.QuadraticBezierCurve3(tail, mid, tip);
      thread.geometry.dispose();
      thread.geometry = new THREE.TubeGeometry(curve, 24, 0.0024, 8, false);
      thread.visible = tail.distanceTo(tip) > 0.002;
    } else thread.visible = false;
  }

  // ambient occlusion: tighter for the close-up on the page, so cards get contact, not a halo
  stage.gtao.gtaoMaterial.uniforms.radius.value = lerp(0.35, 0.05, seg(t, 33.3, 34.8));
  stage.gtao.blendIntensity = lerp(0.8, 0, seg(t, 34.2, 35.2));
}

stage.run({ duration: DUR, update });
</script>
</body></html>
