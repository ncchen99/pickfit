[project]
name = "pickfit"
version = "0.1.0"
description = "A neutral software advisor: discover, verify and match little-known but good software for any AI agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.16",
    "modal>=1.6.3",
    "openai>=1.50",
    "pillow>=13.0.0",
    "pydantic>=2.9",
]

[project.scripts]
pickfit = "pickfit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "tldextract==5.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pickfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
