- id: b12
  category: mcp_server
  kind: find_software
  language: en
  prompt: >-
    I'm looking for a good code-intelligence MCP server (semantic search, symbol lookup, call graphs and so on) to
    pair with an AI coding agent, so the model gets structured access to the codebase instead of relying only on
    grep and file reads. The space feels fragmented: there are a handful of options but no clear winner. Has anyone
    settled on one? What sold you on it? I mainly care about how well the agent actually uses the structured data,
    how painful setup and indexing are, and whether it is worth it over simpler approaches (ripgrep, good project
    docs, AGENTS.md).
  constraints:
    os: any
    arch: any
    budget: not_stated
    must_run_locally: not_stated
    other:
    - It is an MCP server used with an AI coding agent
    - Provides semantic search, symbol lookup and call graphs over a codebase
    preferences: []
  current_software: null
