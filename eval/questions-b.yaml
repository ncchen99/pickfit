- id: b10
  category: mcp_server
  kind: find_software
  language: en
  prompt: >-
    When I develop an Android app I usually do this: ask an LLM to write a particular feature, build the APK,
    install it on a physical phone connected by USB, test the feature by touching the screen, typing, and
    sometimes tilting the phone or otherwise sending signals to its sensors, note every bug I find, and ask the LLM
    to fix them, then start again until no bugs are left, and finally review the code manually. I believe an MCP
    server could do the build, install, test and bug-finding steps automatically, including recording the screen
    while it tests. Is there an MCP server that builds an Android app, installs it on a device, tests it, works out
    how well it is going, and finds bugs? It has to be free of charge, open source and a standard MCP server.
    Ideally it works with real devices as well as emulators, and can run tests on several devices in parallel.
  constraints:
    os: any
    arch: any
    budget: free
    must_run_locally: not_stated
    other:
    - It is an MCP server (standard MCP)
    - Open source
    - Free of charge
    - Builds an Android app, installs it on a device, and tests it by touching, typing and similar input
    - Records the screen while testing
    - Works out how well the test is going and finds bugs
    preferences:
    - Works with both real physical devices and emulators
    - Can run tests on several devices in parallel
  current_software: null
  pain_points:
  - Manual build, install and touch-testing cycles for every LLM-written change
  success_checklist:
  - '[L1] The recommended server exists, is open source and free per its repository and licence, and is an MCP server'
  - >-
    [L1] Its documented tools cover installing an Android build on a device or emulator and driving it with touch and
    text input, and recording the screen; the answer says how bugs are found or that the agent does that from
    screenshots and logs
  - >-
    [L1] If the answer combines several servers or tools, each part is named; if a step (such as building the APK)
    is not covered by a server, the answer says so
  - '[L2] The answer''s install steps succeed verbatim in the dev image'
  - >-
    [L2] The server starts as an MCP server over its documented transport and a pinned reference MCP client lists
    its tools; the listed tools include those the L1 item relied on
  - >-
    [L2] Where an Android emulator can run in the dev image: with a frozen fixture APK installed on it, a frozen tap
    sequence through the server's tools changes the app's screen as expected and a screen recording file is
    produced. Where an emulator cannot run (no hardware virtualization), this item is recorded as not run for both
    groups
  why_famous_may_not_fit: null
  sandbox: linux_sandbox
  rationale: >-
    Real question (Software Recommendations SE, 2025-12-11), mcp bucket seed position 793. 'while recording screen'
    comes from the post's title. Real devices and parallel runs are preferences and not scored. L2 depends on
    whether the Modal image can run an emulator; this is checked at fixture time.
