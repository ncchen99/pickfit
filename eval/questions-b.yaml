    [L1] The recommended server exists, is an MCP server, and its docs show semantic search, symbol lookup and call
    graph tools for source code
  - >-
    [L3] The answer says how painful setup and indexing are and whether the server is worth it over simpler
    approaches (ripgrep, project docs, AGENTS.md), instead of presenting it as always better
  - '[L2] The answer''s install steps succeed verbatim in the dev image'
  - >-
    [L2] Fixture: a small frozen repository in three languages. After indexing as the answer describes, a pinned
