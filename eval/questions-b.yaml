- id: b07
  category: local_ai
  kind: find_software
  language: en
  prompt: >-
    I want to build an offline tutor and assistant for three high-school subjects. It has to be a tiny but useful
    model, because it will run on a mobile phone, absolutely offline. For each subject I have the syllabus, the
    textbooks, practice questions and plenty of old exam papers with answers. I want it tailored to this academic
    level: students ask a question and get an explanation drawn from the books and kept within the syllabus. If
    possible, students should also be able to practice exam questions, with the model either fetching past and
    practice questions on a topic or generating similar ones. I'm fairly new to this. What model should I use, how
    should I train it, should I use RAG or a purely generative model (or something in between), and what challenges
    and workarounds should I expect?
  constraints:
    os: any
    arch: any
    budget: not_stated
    must_run_locally: true
    other:
    - Runs on a mobile phone, completely offline
    - A tiny model that is still useful
    - Answers come from the supplied syllabus and textbooks and stay within the syllabus
    - Supports exam practice by fetching past or practice questions on a topic, or generating similar ones
    preferences: []
  current_software: null
  pain_points:
  - New to building this; unsure whether to fine-tune, use RAG, or mix
  success_checklist:
  - >-
    [L1] The recommended model exists with weights that allow on-device use, and a runtime for it exists for at
    least one mobile OS and works with no network connection, per the docs
  - >-
    [L1] The answer's model size is small enough for a phone: the answer states the memory needed, and it is
    4 GB or less
  - >-
    [L1] The answer gives an approach (RAG, fine-tuning or a mix) that keeps answers grounded in the supplied
    books, and names the expected challenges with workarounds, as the asker asked
  - '[L2] The answer''s model and runtime install steps succeed verbatim in the dev image'
  - >-
    [L2] Fixture: a small synthetic syllabus and textbook excerpt with 5 unique made-up facts and a bank of 10
    practice questions. With egress blocked after setup and memory capped at 4 GB (the limit in L1), the
    answer's setup answers 5 frozen questions with the exact fact token for at least 4 of 5, and can return or
    generate a practice question on a frozen topic
  - '[L2] Egress check passes during the run'
  why_famous_may_not_fit: null
  sandbox: linux_sandbox
  rationale: >-
    Real question (Ask HN, 2025-01-26), local_ai bucket seed position 88. Open-ended and the least tool-specific of
    the twelve; it states conditions (phone, offline, tiny model, grounded in the supplied books, exam practice) but
    asks for an approach as much as for software. The phone OS is not stated, so the L2 run is a Linux proxy for the
    memory and offline limits, not a phone test.
  source:
    site: Hacker News (Ask HN)
    url: https://news.ycombinator.com/item?id=42831796
    posted: 2025-01-26
    original_title: 'Ask HN: Best approach for an offline LLM assistant for 3 high school subjects'
    license: not stated by the site; paraphrased, no text copied
