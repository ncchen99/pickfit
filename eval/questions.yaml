# pickfit 評測題組 v1
#
# 比賽期間（2026-10-28）新寫，沒有使用賽前的評測草稿：由 AI agent 起草（3 個起草、1 個挑選、3 個審查、1 個定稿），念誠逐題審定後凍結。
# 本檔 commit 的那一刻就是凍結：之後不改題目，只能在 eval/README.md 的勘誤區追加說明。
# 題目只描述需求與可檢查的條件，刻意不寫預期答案（避免照著題目準備資料）。
# 評分方式見 eval/README.md。

version: 1
questions:
- id: q01
  category: dev_cli
  kind: find_software
  language: en
  prompt: I use Claude Code, Codex CLI and Gemini CLI on the same laptop, and every time I add an MCP
    server I have to hand-edit three config files in three different formats. Is there a free command-line
    tool that keeps one list of my MCP servers and syncs it into all three agents' configs? It should
    run locally with no account and leave my other settings alone.
  constraints:
    os: any
    arch: any
    budget: free
    must_run_locally: true
    other:
    - Operated from the command line; no GUI or web dashboard needed
    - Writes MCP server entries for all three of Claude Code, Codex CLI and Gemini CLI
    - Free to use; no account or sign-up
    - Makes no network connections while adding or syncing servers
    - Preserves unrelated settings already present in the target config files
  current_software: null
  pain_points:
  - The same MCP server must be added three times
  - Three config formats (JSON and TOML) drift out of sync
  - Hand edits break existing settings
  success_checklist:
  - '[L1] The tool exists in a public repository or package registry; its README or docs state MCP config
    support for Claude Code, Codex CLI and Gemini CLI; it is free and needs no account'
  - '[L2] The answer''s install steps succeed verbatim in the dev image'
  - '[L2] Fixture: every MCP config location each pinned agent documents (user scope and project scope)
    is seeded with one unrelated setting. After adding the frozen stdio fixture MCP server through the
    tool and syncing, every seeded file still parses as JSON or TOML and every seeded unrelated setting
    is unchanged'
  - '[L2] With pinned versions of the three agent CLIs installed (versions recorded at freeze), each agent''s
    own MCP list command, run with no login and with egress blocked, shows the new server. If pre-freeze
    calibration shows a pinned agent''s list command cannot run offline without login, that agent is checked
    by validating its config against its documented schema instead, and the substitution is recorded before
    the freeze'
  - '[L2] Egress check passes for the add and sync steps'
  why_famous_may_not_fit: Each agent ships its own 'add MCP server' command, but each writes only its
    own config, so the built-ins still mean three edits. General dotfile managers copy files verbatim
    and cannot translate between the JSON and TOML schemas. No long-established tool owns this niche,
    so the question tests finding a small, recent project and getting its sync to write configs that each
    agent accepts.
  sandbox: linux_sandbox
  rationale: 'Priority user: developer who uses several AI agents; the friction grows with every new MCP
    server. Layers 1 and 2. Expected control difficulty: hard. Cluster: mcp-tooling. Changes: ''no account''
    moved into the prompt; user- and project-scope fixtures; agent list commands made mandatory with a
    pre-freeze fallback; egress logging instead of an offline-only run.'
- id: q02
  category: dev_cli
  kind: find_software
  language: en
  prompt: Before I paste server logs into an AI chat, I want to automatically scrub API keys, tokens,
    email addresses and IP addresses out of them. Is there a free, open-source command-line filter (stdin
    to stdout) that does this entirely on my Linux machine, without me having to write the regexes myself?
  constraints:
    os: linux
    arch: any
    budget: free
    must_run_locally: true
    other:
    - Reads from stdin and writes redacted text to stdout
    - Makes no network calls
    - OSI-approved open-source license
    - Built-in detection (no hand-written regex) for at least cloud access keys, Git hosting tokens, email
      addresses and IPv4 addresses
  current_software: null
  pain_points:
  - Fear of leaking secrets and personal data to cloud AI tools
  - Manual find-and-replace is error-prone
  - Secret scanners report findings instead of producing a cleaned copy
  success_checklist:
  - '[L1] The tool exists, has an OSI-approved license, and its docs show stdin-to-stdout filter usage
    with built-in rules'
  - '[L2] The install steps succeed verbatim in the dev image'
  - '[L2] Fixture log produced at test time by the frozen seeded generator (fake values are never committed):
    one AWS-format access key ID (AKIA plus 16 random [A-Z0-9]), one GitHub-format personal access token
    (ghp_ prefix, valid length and checksum format), two email addresses at example.com and example.org,
    two public unicast IPv4 addresses outside private, loopback, link-local, shared 100.64/10, documentation
    and multicast ranges, plus ordinary lines. Run as one pipeline (`cat app.log | <tool with the answer''s
    flags> > clean.log`). A value counts as masked when its exact string is absent and: for the key and
    token, no run of 5 or more characters of the random part survives; for emails, the local part is gone;
    for IPs, at least the last two octets are gone. All six values must be masked'
  - '[L2] Ordinary lines (timestamps, log levels, file paths, HTTP status codes and durations only; no
    UUIDs, hashes or dotted version strings) are byte-identical in the output'
  - '[L2] Egress check passes during the run'
  why_famous_may_not_fit: The best-known secret scanners are built to scan repositories and report findings,
    and some verify keys against provider APIs (network calls), rather than rewriting a text stream. General
    PII toolkits are usually libraries, not ready-made CLI filters. No single well-known tool obviously
    covers secrets plus PII as a stdin filter, so this tests matching on the stream-rewriting requirement.
  sandbox: linux_sandbox
  rationale: 'Priority user: privacy-minded developer who uses cloud AI but controls what leaves the machine.
    Layers 1 and 2. Expected control difficulty: medium. Changes: ''open-source'' and ''built-in rules''
    moved into the prompt; masking defined precisely; fake secrets generated at test time (no token-shaped
    strings committed, so no push-protection hits); IP ranges chosen so default allowlists cannot cause
    false failures; egress logging.'
- id: q03
  category: dev_cli
  kind: find_software
  language: en
  prompt: I regularly get 2-5 GB CSV exports and need to filter rows, pick columns, and do group-by counts
    from the terminal on Linux. pandas is too slow and memory-hungry, and awk breaks on quoted fields
    that contain commas and line breaks. What free, open-source tool should I use? It must be a single
    binary or a distro package, with no Python, Java or Node runtime.
  constraints:
    os: linux
    arch: x86_64
    budget: free
    must_run_locally: true
    other:
    - OSI-approved open-source license
    - Installable as a single prebuilt binary or a distro package; no Python, Java or Node runtime
    - 'Parses RFC 4180 correctly: quoted fields with embedded commas, escaped quotes and newlines'
    - Peak memory at most half the file size (streaming or indexed processing)
  current_software: null
  pain_points:
  - pandas is too slow and memory-hungry on multi-GB files
  - awk and cut break on quoted fields with commas and newlines
  success_checklist:
  - '[L1] The tool exists, has an OSI-approved license, and ships a prebuilt Linux x86_64 binary or a
    distro package'
  - '[L2] The install steps succeed verbatim in the base image (no python3, node or java); afterwards
    `command -v python3 java node` prints nothing'
  - '[L2] Frozen fixture CSV whose quoted fields contain commas, escaped double quotes and embedded newlines:
    the answer''s commands for a row filter, a column selection and a group-by count return exactly the
    frozen expected outputs'
  - '[L2] On a 2 GB CSV from the frozen seeded generator (about 20 columns, a group key with 1,000 distinct
    values, quoted fields in 5% of rows), all commands the answer gives for the group-by count, including
    any index build, finish within 5 minutes on 4 vCPU, and container memory.peak stays at or below 1
    GB'
  why_famous_may_not_fit: Several well-known single-binary CSV tools and embedded SQL engines likely meet
    every constraint, while the best-known Python CSV toolkit and pandas do not. A tie is expected; this
    is a no-regression item that checks the agent avoids runtime-based tools and gives correct, quote-aware
    commands.
  sandbox: linux_sandbox
  rationale: 'Covers data wrangling within dev_cli for budget-limited users. Layers 1 and 2. Expected
    control difficulty: easy (no-regression subset). Changes: ''single binary'' and ''open-source'' are
    now hard requirements in the prompt; memory limit set to 50% of file size; frozen generator; index
    build counted in the time limit; runtime absence checked with command -v.'
- id: q04
  category: dev_cli
  kind: find_software
  language: en
  prompt: Our 4-person team shares .env files over chat, which is obviously bad. We want to commit the
    secrets to our git repo encrypted, let each developer decrypt with their own key, and be able to cut
    someone off cleanly when they leave the team. No hosted secrets service and no server to run, and
    it has to be free and open source. We use macOS and Linux.
  constraints:
    os: any
    arch: any
    budget: free
    must_run_locally: true
    other:
    - No hosted service, no account, no self-run server
    - Per-developer keys; people can be added or removed without sharing one master password
    - Encrypted file is committed to git; plaintext is never committed
    - CLI available on macOS and Linux
    - Free and open source
  current_software: null
  pain_points:
  - Secrets are shared in plaintext over chat
  - Hosted secrets managers cost money per seat or need an account
  - Offboarding a developer must be clean
  success_checklist:
  - '[L1] The recommended tool or tools exist, are open source, and install on macOS and Linux without
    any account, per docs or release assets'
  - '[L2] In the dev image, with fresh keypairs generated by the grader for developers A, B and C (of
    the type the answer specifies), A encrypts and commits a sample .env as the answer describes; for
    every secret value, `git rev-list --all | xargs git grep -F <value>` finds nothing, and the plaintext
    .env is untracked and git-ignored'
  - '[L2] Developer B, added as a recipient, decrypts the committed file in a separate container; developer
    C, never added, cannot'
  - '[L2] After the answer''s removal and rotation steps for B, B cannot decrypt the newly committed version.
    If the answer gives no removal steps, this item fails'
  - '[L2] Egress check passes for encryption and decryption'
  why_famous_may_not_fit: Hosted secrets managers need an account and often per-seat payment, and server-based
    vaults need infrastructure. Well-known git-native encryption tools likely meet every constraint, so
    this is mainly a no-regression item; it also tests that the answer gives correct removal and rotation
    steps (layer 2).
  sandbox: linux_sandbox
  rationale: 'Priority user: small, budget-limited team. Checks rest on cryptographic facts only. Expected
    control difficulty: easy (no-regression subset). Changes: offboarding and ''open source'' moved into
    the prompt; history-wide grep; .env must be ignored; missing removal steps fail; grader generates
    keys.'
- id: q05
  category: dev_cli
  kind: find_alternatives
  language: zh-TW
  prompt: 我平常用 pandoc 把 Word 檔轉成 Markdown 給 AI 讀，但它不能讀 PDF，而我們很多規格書都是 PDF。想找一個在 Linux 終端機就能用的工具，PDF 和
    Word 都能轉成 Markdown，PDF 裡的表格要保留成表格，標題層級也要正確。公司文件不能上傳到雲端，只能在本機跑，電腦也沒有 GPU。免費最好，買斷也可以，但不要訂閱制。
  constraints:
    os: linux
    arch: x86_64
    budget: free_or_one_time
    must_run_locally: true
    other:
    - One CLI tool converts both text-based PDF and DOCX to Markdown
    - Runs locally and offline after setup; no cloud API
    - CPU only (no GPU)
    - Tables become Markdown tables; heading levels are preserved
    - Free or one-time purchase; not a subscription
  current_software: pandoc
  pain_points:
  - The current tool cannot take PDF input
  - Company documents must not be uploaded to cloud converters
  - No GPU available
  - Does not want subscription software
  success_checklist:
  - '[L1] The tool exists; it is free or a one-time purchase, not a subscription; its docs list PDF and
    DOCX input, Markdown output, and a local mode with no cloud API'
  - '[L1] One tool handles both PDF and DOCX'
  - '[L2] The install steps succeed verbatim in the dev image (x86_64, CPU only, 4 vCPU and 16 GB); any
    model downloads happen during setup'
  - '[L2] Frozen fixtures: a text-based PDF (CJK font embedded) and a DOCX with the same content: Traditional
    Chinese and English text, one H1, two H2s, a 4-column table with a header row and 2 data rows (12
    cells), and a bullet list. With egress blocked, each converts to a .md file in which the headings
    are ATX headings at the right levels, the table is a Markdown pipe table whose 12 cell texts match
    the fixture, and the list items are Markdown list items'
  - '[L2] A frozen diff script finds at least 98% of the fixture''s CJK characters, in order, in each
    output, with no replacement characters'
  - '[L2] Each conversion finishes within 10 minutes'
  - '[L2] Egress check passes during the conversions'
  why_famous_may_not_fit: pandoc (the current tool) cannot read PDF. Widely shared document-to-Markdown
    converters handle Word files well but may flatten PDF tables into plain text, while heavier layout-model
    converters may keep tables but need GPU-class resources or long CPU runs. Hosted parsing services
    break the no-upload rule and are often subscriptions. This tests matching on 'PDF tables preserved,
    CPU only, offline'.
  sandbox: linux_sandbox
  rationale: 'New question; replaces the terminal disk-usage browser, where one well-known tool very likely
    fit. Priority users: privacy-minded small teams, Traditional Chinese speakers, people who avoid subscriptions;
    keeps the set''s only free_or_one_time budget. Layer 2: table and heading fidelity on CPU. Expected
    control difficulty: medium.'
- id: q06
  category: dev_cli
  kind: find_software
  language: en
  prompt: We have an internal REST API described by an OpenAPI 3 spec, and I want my AI coding agents
    to call it as MCP tools. Is there a free, open-source tool that turns the spec into a working MCP
    server I can run locally, without writing the server code by hand and without a hosted service or
    account? It should forward the agents' tool calls to our API's base URL.
  constraints:
    os: any
    arch: any
    budget: free
    must_run_locally: true
    other:
    - OSI-approved open-source license
    - Produces or serves an MCP server (stdio or streamable HTTP) from an OpenAPI 3.x spec without hand-written
      handler code
    - Runs locally; no hosted service or account
    - Forwards tool calls to a configurable API base URL
    - Makes no network connections other than to the configured API
  current_software: null
  pain_points:
  - Writing an MCP wrapper by hand for every endpoint
  - Hosted conversion services would put a vendor in the path of internal API traffic
  - Wants every agent that speaks MCP to use the same tools
  success_checklist:
  - '[L1] The tool exists, has an OSI-approved license, its docs show OpenAPI 3 input producing a runnable
    MCP server, and no account or hosted service is needed'
  - '[L1] The answer does not require hand-writing server or handler code; an answer that does fails this
    item'
  - '[L2] The install steps succeed verbatim in the dev image'
  - '[L2] Frozen fixtures: an OpenAPI 3.0 spec with GET /items/{id} and POST /items, and a mock API script
    on localhost. Following the answer, with only config values changed (spec path, base URL, auth placeholder)
    and any generated code used unmodified, a pinned reference MCP client lists exactly two tools that
    correspond to the two operations'
  - '[L2] Calling the GET tool with id 42 returns content that includes the mock''s unique token, and
    the mock''s log shows GET /items/42; calling the POST tool with the frozen body makes the mock receive
    that JSON body'
  - '[L2] Egress check passes for generation, startup and both tool calls (only the localhost mock is
    reached)'
  why_famous_may_not_fit: MCP is recent, so there is no long-established default. Some well-known MCP
    frameworks offer OpenAPI import only as a library call inside a program you write, and several platforms
    do the conversion as a hosted or account-based service. This tests finding a runnable local tool and
    configuring its base URL correctly.
  sandbox: linux_sandbox
  rationale: 'New question; replaces the self-hosted tunnel, where one well-known tool very likely fit.
    Priority users: developers who use several AI agents and avoid vendor lock-in. Layers 1 and 2, fully
    checkable offline with a mock API. Expected control difficulty: medium. Cluster: mcp-tooling.'
- id: q07
  category: dev_cli
  kind: find_software
  language: en
  prompt: I want our team's API requests to live in our git repo as plain-text files that diff cleanly
    in code review, instead of in a cloud workspace that needs sign-in. Is there a free, open-source tool
    that works fully offline on my Mac and has a CLI that runs the same request files as tests in our
    Linux CI, failing the build when an assertion fails?
  constraints:
    os: any
    arch: any
    budget: free
    must_run_locally: true
    other:
    - OSI-approved open-source license
    - No account or sign-in for any feature the answer uses
    - Works offline; network traffic only to the target host
    - Requests are plain-text files in the project directory; one edit gives a small diff
    - CLI runner on Linux x86_64 that exits non-zero when an assertion fails
    - Install path documented for macOS arm64 and Linux x86_64
  current_software: null
  pain_points:
  - Popular API clients push account sign-in and cloud sync of collections
  - Collections are not stored as small diffable files in the repo
  - Wants the same requests to run as tests in CI
  success_checklist:
  - '[L1] The tool exists, its license file shows an OSI-approved license, and every feature the answer
    uses works without an account'
  - '[L2] The install steps succeed verbatim in the dev image (Linux x86_64); docs or releases list macOS
    arm64 support'
  - '[L2] Frozen fixture: a local server that returns 200 with body {ok: true}. Three requests are written
    in the tool''s file format as the answer describes; one asserts status 200 and body field ok equal
    to true. The CLI run exits 0'
  - '[L2] The same run exits non-zero when the server returns 500, and again when it returns 200 with
    ok false'
  - '[L2] Changing one request''s URL produces a git diff of at most 3 changed lines in one UTF-8 text
    file; the other requests'' files are untouched'
  - '[L2] Egress check passes during the CLI runs (localhost only)'
  why_famous_may_not_fit: The best-known API client ties collections to an account and cloud workspace
    and exports them as one large JSON file. Several well-known open-source API clients and plain-text
    HTTP test runners likely fit, so this is a no-regression item that checks the agent avoids the account-bound
    default and gives working CI assertions.
  sandbox: linux_sandbox
  rationale: 'Priority user: team that does not want its workflow locked into one vendor. Layers 1 and
    2. Expected control difficulty: easy (no-regression subset). Changes: ''diff cleanly'' moved into
    the prompt and given a 3-line threshold; fixture and both failure modes frozen; egress logging.'
- id: q08
  category: dev_cli
  kind: find_alternatives
  language: en
  prompt: My company just grew past 250 employees, so Docker Desktop now needs a paid license for us.
    I need a free, open-source way to run containers from the terminal on my Apple silicon MacBook that
    still works with my existing docker and docker compose commands and runs arm64 images.
  constraints:
    os: macos
    arch: arm64
    budget: free
    must_run_locally: true
    other:
    - License permits free commercial use at a company of more than 250 employees, with no size or revenue
      threshold
    - Core component under an OSI-approved license
    - Runs natively on Apple silicon and runs arm64 Linux images
    - Existing docker CLI commands and docker compose files work without rewriting
    - Operable entirely from the terminal
  current_software: Docker Desktop
  pain_points:
  - Paid subscription required above 250 employees or a revenue threshold
  - Wants to avoid vendor lock-in
  - Does not want to rewrite compose files
  - Only needs the CLI, not a GUI desktop app
  success_checklist:
  - '[L1] The recommended option''s license or pricing allows free commercial use regardless of company
    size, and its core component has an OSI-approved license'
  - '[L1] The primary recommendation is not a tool whose license requires payment for commercial use at
    this company size'
  - '[L2] In a separate macOS user account on Apple silicon, with Docker Desktop not running and not the
    active docker context or DOCKER_HOST, the install steps run as written'
  - '[L2] `docker run --rm hello-world` succeeds and `docker image inspect hello-world --format ''{{.Architecture}}''`
    prints arm64'
  - '[L2] Frozen compose fixture (an nginx-alpine web service published on port 8080 and a redis-alpine
    service): `docker compose up -d` starts both, and `curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8080`
    run on the macOS host returns 200'
  - '[L2] No GUI: a terminal sudo prompt is allowed; any macOS dialog or app window that must be clicked
    fails this item'
  why_famous_may_not_fit: Docker Desktop (the current tool) needs a paid plan above the size threshold,
    and the best-known polished Mac container app is free only for personal use. Well-known open-source
    VM-based runtimes likely fit, so this mainly tests that the agent checks commercial licensing and
    that docker and compose work unchanged (layer 2).
  sandbox: mac_only
  rationale: 'Priority user: Apple silicon developer avoiding subscription lock-in, on the same kind of
    machine as the demo. Expected control difficulty: easy (no-regression subset). Changes: arm64 verified
    by image inspect; host-side curl; ''no GUI'' defined; runs in a separate macOS user without uninstalling
    anything.'
- id: q09
  category: dev_cli
  kind: find_software
  language: zh-TW
  prompt: 我同時用 Claude Code 和 Codex 寫程式，想把待辦事項改成存在 repo 裡的純文字檔，跟著 git 一起版本控制，不想再用線上的 issue 系統。有沒有命令列工具，讓我和
    agent 都能新增、列出、關閉任務，列表也能輸出成 JSON 給 agent 讀？要免費、開源、不用帳號、離線可用，Mac 和 Linux 都能跑。
  constraints:
    os: any
    arch: any
    budget: free
    must_run_locally: true
    other:
    - OSI-approved open-source license
    - Task data is stored as plain-text files inside the repository directory (not a home-directory database)
    - CLI can create, list and close tasks
    - Task list can be output as JSON
    - No account; works offline
    - Runs on macOS and Linux
  current_software: null
  pain_points:
  - Online issue trackers need accounts and are not versioned with the code
  - Coding agents cannot easily read or update tasks
  - Wants tasks to travel with the repo in git
  success_checklist:
  - '[L1] The tool exists, has an OSI-approved license, its docs show task storage inside the project
    directory and a JSON output option, and docs or releases show macOS and Linux support'
  - '[L2] The install steps succeed verbatim in the dev image as a non-root user'
  - '[L2] In a fresh git repo, using only commands from the answer or the tool''s docs: create 3 tasks
    (one titled in Traditional Chinese) and close 1. The JSON listing parses with jq and identifies exactly
    the 2 open tasks (either only open tasks are listed, or a status field marks the closed one), and
    the Chinese title round-trips intact'
  - '[L2] After committing, a fresh clone with no other state (no home-directory data, no untracked files)
    lists the same tasks with the same statuses, so the committed text files are the source of truth'
  - '[L2] The committed task data is UTF-8 text, and closing one more task changes at most 5 lines in
    git diff'
  - '[L2] Egress check passes for all commands'
  why_famous_may_not_fit: The best-known terminal task managers keep data in a home-directory database
    rather than in the repo, well-known plain-text todo formats have no JSON output, and hosted issue
    trackers need accounts. The need is recent and tied to coding agents, so this tests matching on storage
    location and machine-readable output.
  sandbox: linux_sandbox
  rationale: 'New question; replaces the tmux alternative, where one well-known tool very likely fit and
    the ''on-screen hints'' check described that tool''s signature feature. Priority user: Traditional
    Chinese developer who uses several AI agents. Layers 1 and 2. Expected control difficulty: medium.'
- id: q10
  category: dev_cli
  kind: builtin_enough
  language: zh-TW
  prompt: 我用 Markdown 寫中文技術文件，一個段落就是一整行。每次 git diff 都是整行紅綠，根本看不出改了哪幾個字。是不是要另外裝什麼 diff 工具？我在 Ubuntu 上，git
    已經裝好了。
  constraints:
    os: linux
    arch: any
    budget: free
    must_run_locally: true
    other:
    - Must work for Chinese text, which has no spaces between words
    - Prefer a solution that needs only the already-installed git, if that is enough
    - Terminal only
  current_software: git
  pain_points:
  - git diff marks whole lines, so the changed characters in long Chinese paragraphs cannot be seen
  success_checklist:
  - '[L3] The primary answer says no additional diff tool is required; any third-party pager or diff tool
    appears only as an optional extra'
  - '[L2] The proposed command or config uses only git and runs in the base image (git only) with LANG=C.UTF-8,
    under a pseudo-terminal (`script -qc ''<cmd>'' /dev/null`) with GIT_PAGER=cat'
  - '[L2] Frozen fixture: a repo with a single-line paragraph of about 200 Traditional Chinese characters
    in which exactly one character is substituted. A frozen span-extraction script (parsing ANSI color
    runs or [-..-] and {+..+} markers) finds that the removed and added spans are each at most 3 characters
    and contain the changed character. Whole-line marking fails; default whitespace word-diff fails'
  - '[L2] The changed character and its neighbours decode as valid UTF-8, with no split or garbled byte
    sequences'
  - '[L2] If the answer suggests a persistent setting (git config, alias or .gitattributes), after applying
    it the everyday command gives the same character-level result'
  - '[L2] The output is readable in a terminal (color or inline markers), not JSON or a patch that needs
    another tool'
  why_famous_may_not_fit: The usual advice is to install a popular third-party diff pager or structural
    diff tool, which is an unneeded install. git's own word-level modes split on whitespace by default
    and mark the whole Chinese paragraph unless configured for character-level matching in a UTF-8 locale,
    so a shallow 'built-in' answer still fails.
  sandbox: linux_sandbox
  rationale: 'The dev_cli builtin_enough question. Layer 3 (git alone is enough) plus layer 2 (correct
