# q08 frozen compose fixture: an nginx (alpine) web service published on host port 8080
# and a redis (alpine) service. Image tags may get @sha256 digests appended before the
# fixture freeze (see calibration.md); nothing else in this file changes.
services:
  web:
    image: nginx:1.27-alpine
    container_name: q08-web
    ports:
      - "8080:80"
  cache:
    image: redis:7.2-alpine
    container_name: q08-cache
