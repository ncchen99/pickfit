# The pickfit Worker (worker/): typecheck and test on every pull request and push;
# a push to main (or a manual run on main) also deploys the public server, pickfit.app.
#
# The deploy is the same as running it by hand (worker/README.md, deploy checklist):
# remote D1 migrations first, then `pickfit publish`, which validates data/software,
# rebuilds src/generated/index.json and runs `npx wrangler deploy`. Only the top-level
# Worker is deployed; the frozen evaluation envs (eval, eval-rules) are never touched.
# `--no-translate`: new page sentences show in English until a local `uv run pickfit publish`
# translates them (that needs Modal, which CI does not have).
#
# Secrets (repository settings → Secrets and variables → Actions):
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

name: Worker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, in push order; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: npm ci

      - name: Build the index from data/software
        run: npm run build:index

      - run: npm run typecheck

      - run: npm test

      - name: Apply remote D1 migrations
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply pickfit --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy pickfit.app
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: uv run --project .. pickfit publish --no-translate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
