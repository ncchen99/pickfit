# The pickfit Worker (worker/) and the public site, https://pickfit.app.
#
# check (every pull request and push): the Worker's index build, typecheck and tests, the Python tests
# (`uv run pytest -q`; the ones needing Docker or real APIs skip themselves) and `pickfit publish --dry-run`,
# which runs every pre-deploy check (valid records, no test fixtures, clean data/software, a deployable
# wrangler.jsonc) and deploys nothing.
#
# A push to main (or a manual run on main) then deploys, only after check passed:
#
# - deploy: the Cloudflare Worker pickfit-mcp, which serves both https://pickfit.app (custom domain) and
#   pickfit-mcp.ncchen99.workers.dev (for MCP clients still set to that address). Remote D1 migrations first,
#   then `pickfit publish`, which rebuilds src/generated/index.json and runs `npx wrangler deploy` (top-level
#   Worker only; the frozen evaluation envs eval and eval-rules are never touched). `--no-translate`: new page
#   sentences show in English until a local `uv run pickfit publish` translates them (that needs Modal, which CI
#   does not have). Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
#
# pickfit.app ran on Google Cloud Run from 2026-11-18 to 11-22; that deploy job was removed when Cloud Run was
# shut down (worker/cloudrun/README.md).

name: Worker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time, in push order; a newer push waits instead of cancelling a deploy halfway.
concurrency:
  group: worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: npm ci

      - name: Build the index from data/software
        run: npm run build:index

      - run: npm run typecheck

      - run: npm test

      - name: Python tests
        working-directory: .
        run: uv run pytest -q

      - name: Pre-deploy checks (deploys nothing)
        working-directory: .
        run: uv run pickfit publish --dry-run --no-translate

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: npm ci

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply pickfit --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the Worker (pickfit.app and workers.dev)
        run: uv run --project .. pickfit publish --no-translate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
