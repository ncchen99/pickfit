<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 384" width="740" height="384" role="img" aria-labelledby="ladder-t"><title id="ladder-t">Verification levels: read, install, function, replay, verified; environment limits become not verified</title><style>
.f-bg{fill:var(--paper,#F7F7F4)}
.f-box{fill:var(--raised,#FFFFFF);stroke:var(--fitz-line,#4A2E22);stroke-width:2}
.f-soft{fill:var(--raised,#FFFFFF);stroke:var(--line-ctl,#80817A);stroke-width:1}
.f-voice{fill:var(--voice,#F1F6E2);stroke:var(--voice-edge,#A9B77E);stroke-width:1}
.f-quiet{fill:var(--sunk,#F0F1EC)}
.f-rule{stroke:var(--rule,#DEDFD9);stroke-width:1;fill:none}
.f-line{stroke:var(--line-ctl,#80817A);stroke-width:1.5;fill:none}
.f-ink-s{stroke:var(--ink,#1A1D17);stroke-width:2;fill:none}
.f-stitch{stroke:var(--stitch,#C4552D);stroke-width:2;stroke-dasharray:7 5;fill:none}
.f-pass-s{stroke:var(--pass,#2E7A35);stroke-width:2.5;fill:none}
.f-pass{fill:var(--pass,#2E7A35)}
.f-tape{fill:var(--tape,#F5C243);stroke:var(--tape-edge,#A57710);stroke-width:1}
.f-gray{fill:var(--line-ctl,#80817A)}
.f-ink2bar{fill:var(--ink-2,#4F5149)}
.f-arrow{fill:var(--line-ctl,#80817A)}
.f-arrow-st{fill:var(--stitch,#C4552D)}
text{font-family:var(--sans,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif);fill:var(--ink,#1A1D17)}
.t-h{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:700;font-size:15px}
.t-hl{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:700;font-size:17px}
.t-b{font-size:12.5px;fill:var(--ink-2,#4F5149)}
.t-s{font-size:11.5px;fill:var(--ink-3,#65655E)}
.t-n{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.t-big{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:800;font-size:26px}
.t-pass{fill:var(--pass,#2E7A35)}
.t-st{fill:var(--stitch,#C4552D)}
.t-tape{fill:var(--tape-ink,#3A2905)}
.t-halo{stroke:var(--paper,#F7F7F4);stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
</style><defs><marker id="ladder-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrow"/></marker><marker id="ladder-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrow-st"/></marker></defs><rect class="f-bg" width="740" height="384"/>
<rect x="10" y="110" width="124" height="104" rx="4" class="f-box"/>
<text x="22" y="136" class="t-h" text-anchor="start">Read</text>
<text x="22" y="158" class="t-b" text-anchor="start">quotes checked</text>
<text x="22" y="174" class="t-b" text-anchor="start">against the</text>
<text x="22" y="190" class="t-b" text-anchor="start">source</text>
<path d="M137 170L153 170" class="f-line" marker-end="url(#ladder-a)"/>
<rect x="156" y="96" width="124" height="118" rx="4" class="f-box"/>
<text x="168" y="122" class="t-h" text-anchor="start">install</text>
<text x="168" y="144" class="t-b" text-anchor="start">installs cleanly</text>
<text x="168" y="160" class="t-b" text-anchor="start">and starts</text>
<path d="M283 170L299 170" class="f-line" marker-end="url(#ladder-a)"/>
<rect x="302" y="82" width="124" height="132" rx="4" class="f-box"/>
<text x="314" y="108" class="t-h" text-anchor="start">function</text>
<text x="314" y="130" class="t-b" text-anchor="start">a real task</text>
<text x="314" y="146" class="t-b" text-anchor="start">works; or a live</text>
<text x="314" y="162" class="t-b" text-anchor="start">service, or a</text>
<text x="314" y="178" class="t-b" text-anchor="start">model answers</text>
<path d="M429 170L445 170" class="f-line" marker-end="url(#ladder-a)"/>
<rect x="448" y="68" width="124" height="146" rx="4" class="f-box"/>
<text x="460" y="94" class="t-h" text-anchor="start">replay</text>
<text x="460" y="116" class="t-b" text-anchor="start">fresh box,</text>
<text x="460" y="132" class="t-b" text-anchor="start">no model, then</text>
<text x="460" y="148" class="t-b" text-anchor="start">network off</text>
<path d="M575 170L591 170" class="f-line" marker-end="url(#ladder-a)"/>
<path d="M598 54H704L718 68V210Q718 214 714 214H598Q594 214 594 210V58Q594 54 598 54Z" class="f-voice"/>
<text x="606" y="80" class="t-h" text-anchor="start">verified</text>
<text x="606" y="102" class="t-b" text-anchor="start">the steps can</text>
<text x="606" y="118" class="t-b" text-anchor="start">be shown to</text>
<text x="606" y="134" class="t-b" text-anchor="start">users</text>
<path d="M156 226H718" class="f-stitch"/>
<text x="216" y="244" class="t-s t-st" text-anchor="start">stitched on the site: pickfit ran this</text>
<path d="M218.0 216V280H258.0" class="f-line" marker-end="url(#ladder-a)"/>
<rect x="262.0" y="260" width="330" height="42" rx="4" class="f-soft"/>
<text x="274.0" y="278" class="t-b" text-anchor="start">The sandbox can&#x27;t run it (GPU, root, account)</text>
<text x="274.0" y="294" class="t-s" text-anchor="start">→ “not verified” with a reason, never “failed”</text>
<rect x="262.0" y="310" width="330" height="42" rx="4" class="f-soft"/>
<text x="274.0" y="328" class="t-b" text-anchor="start">“failed” comes only from a human</text>
<text x="274.0" y="344" class="t-s" text-anchor="start">or a human check of the published files</text>
<text x="10" y="24" class="t-h" text-anchor="start">How a tool earns its level</text>
<text x="10" y="44" class="t-s" text-anchor="start">Levels are computed from the command log, not from what the agent says. A step whose exit code was hidden doesn&#x27;t count.</text>
<text x="10" y="376" class="t-s" text-anchor="start">Desktop apps: a judge reads pickfit&#x27;s own screenshot. Web apps: a browser agent opens the site and does a core task.</text>
</svg>
