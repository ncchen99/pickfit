<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 414" width="740" height="414" role="img" aria-labelledby="trust-t"><title id="trust-t">Six checks between a README and an answer: quote check, command log, separate judge, offline replay, security and visual checks, labels</title><style>
.f-bg{fill:var(--paper,#F7F7F4)}
.f-box{fill:var(--raised,#FFFFFF);stroke:var(--fitz-line,#4A2E22);stroke-width:2}
.f-soft{fill:var(--raised,#FFFFFF);stroke:var(--line-ctl,#80817A);stroke-width:1}
.f-voice{fill:var(--voice,#F1F6E2);stroke:var(--voice-edge,#A9B77E);stroke-width:1}
.f-quiet{fill:var(--sunk,#F0F1EC)}
.f-rule{stroke:var(--rule,#DEDFD9);stroke-width:1;fill:none}
.f-line{stroke:var(--line-ctl,#80817A);stroke-width:1.5;fill:none}
.f-ink-s{stroke:var(--ink,#1A1D17);stroke-width:2;fill:none}
.f-stitch{stroke:var(--stitch,#C4552D);stroke-width:2;stroke-dasharray:7 5;fill:none}
.f-pass-s{stroke:var(--pass,#2E7A35);stroke-width:2.5;fill:none}
.f-pass{fill:var(--pass,#2E7A35)}
.f-tape{fill:var(--tape,#F5C243);stroke:var(--tape-edge,#A57710);stroke-width:1}
.f-gray{fill:var(--line-ctl,#80817A)}
.f-ink2bar{fill:var(--ink-2,#4F5149)}
.f-arrow{fill:var(--line-ctl,#80817A)}
.f-arrow-st{fill:var(--stitch,#C4552D)}
text{font-family:var(--sans,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif);fill:var(--ink,#1A1D17)}
.t-h{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:700;font-size:15px}
.t-hl{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:700;font-size:17px}
.t-b{font-size:12.5px;fill:var(--ink-2,#4F5149)}
.t-s{font-size:11.5px;fill:var(--ink-3,#65655E)}
.t-n{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.t-big{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:800;font-size:26px}
.t-pass{fill:var(--pass,#2E7A35)}
.t-st{fill:var(--stitch,#C4552D)}
.t-tape{fill:var(--tape-ink,#3A2905)}
.t-halo{stroke:var(--paper,#F7F7F4);stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
</style><defs><marker id="trust-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrow"/></marker><marker id="trust-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrow-st"/></marker></defs><rect class="f-bg" width="740" height="414"/>
<text x="10" y="24" class="t-h" text-anchor="start">Six checks between a README and an answer</text>
<text x="560" y="24" class="t-s" text-anchor="start">what it catches</text>
<rect x="10" y="44" width="530" height="44" rx="4" class="f-box"/>
<circle cx="34" cy="66" r="12" class="f-tape"/>
<text x="34" y="71" class="t-n t-tape" text-anchor="middle">1</text>
<text x="56" y="63" class="t-h" text-anchor="start">Quote check</text>
<text x="56" y="80" class="t-s" text-anchor="start">every extracted fact carries a quote the code finds in the source</text>
<path d="M548 66L556 66" class="f-line" marker-end="url(#trust-a)"/>
<text x="562" y="71" class="t-b" text-anchor="start">invented facts</text>
<path d="M34 88V98" class="f-stitch"/>
<rect x="10" y="98" width="530" height="44" rx="4" class="f-box"/>
<circle cx="34" cy="120" r="12" class="f-tape"/>
<text x="34" y="125" class="t-n t-tape" text-anchor="middle">2</text>
<text x="56" y="117" class="t-h" text-anchor="start">Command log</text>
<text x="56" y="134" class="t-s" text-anchor="start">levels come from what ran and exited 0; hidden exit codes don&#x27;t count</text>
<path d="M548 120L556 120" class="f-line" marker-end="url(#trust-a)"/>
<text x="562" y="125" class="t-b" text-anchor="start">claimed success</text>
<path d="M34 142V152" class="f-stitch"/>
<rect x="10" y="152" width="530" height="44" rx="4" class="f-box"/>
<circle cx="34" cy="174" r="12" class="f-tape"/>
<text x="34" y="179" class="t-n t-tape" text-anchor="middle">3</text>
<text x="56" y="171" class="t-h" text-anchor="start">A separate judge</text>
<text x="56" y="188" class="t-s" text-anchor="start">another model call reads the output or screenshot</text>
<path d="M548 174L556 174" class="f-line" marker-end="url(#trust-a)"/>
<text x="562" y="179" class="t-b" text-anchor="start">output that misses the feature</text>
<path d="M34 196V206" class="f-stitch"/>
<rect x="10" y="206" width="530" height="44" rx="4" class="f-box"/>
<circle cx="34" cy="228" r="12" class="f-tape"/>
<text x="34" y="233" class="t-n t-tape" text-anchor="middle">4</text>
<text x="56" y="225" class="t-h" text-anchor="start">Fresh offline replay</text>
<text x="56" y="242" class="t-s" text-anchor="start">a new sandbox reruns the steps with no model, then offline</text>
<path d="M548 228L556 228" class="f-line" marker-end="url(#trust-a)"/>
<text x="562" y="233" class="t-b" text-anchor="start">steps that worked once</text>
<path d="M34 250V260" class="f-stitch"/>
<rect x="10" y="260" width="530" height="44" rx="4" class="f-box"/>
<circle cx="34" cy="282" r="12" class="f-tape"/>
<text x="34" y="287" class="t-n t-tape" text-anchor="middle">5</text>
<text x="56" y="279" class="t-h" text-anchor="start">Security and visual checks</text>
<text x="56" y="296" class="t-s" text-anchor="start">OSV.dev advisories cap quality; screenshot defects cost 5%</text>
<path d="M548 282L556 282" class="f-line" marker-end="url(#trust-a)"/>
<text x="562" y="287" class="t-b" text-anchor="start">known risks, broken screens</text>
<path d="M34 304V314" class="f-stitch"/>
<rect x="10" y="314" width="530" height="44" rx="4" class="f-voice"/>
<circle cx="34" cy="336" r="12" class="f-tape"/>
<text x="34" y="341" class="t-n t-tape" text-anchor="middle">6</text>
<text x="56" y="333" class="t-h" text-anchor="start">Labels in the answer</text>
<text x="56" y="350" class="t-s" text-anchor="start">how_we_know, evidence_url, “not verified”, matched_by</text>
<path d="M548 336L556 336" class="f-line" marker-end="url(#trust-a)"/>
<text x="562" y="341" class="t-b" text-anchor="start">over-trust</text>
</svg>
