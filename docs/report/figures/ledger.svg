<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 514" width="740" height="514" role="img" aria-labelledby="ledger-t"><title id="ledger-t">Experiments that shipped and experiments that were tried and not shipped</title><style>
.f-bg{fill:var(--paper,#F7F7F4)}
.f-box{fill:var(--raised,#FFFFFF);stroke:var(--fitz-line,#4A2E22);stroke-width:2}
.f-soft{fill:var(--raised,#FFFFFF);stroke:var(--line-ctl,#80817A);stroke-width:1}
.f-voice{fill:var(--voice,#F1F6E2);stroke:var(--voice-edge,#A9B77E);stroke-width:1}
.f-quiet{fill:var(--sunk,#F0F1EC)}
.f-rule{stroke:var(--rule,#DEDFD9);stroke-width:1;fill:none}
.f-line{stroke:var(--line-ctl,#80817A);stroke-width:1.5;fill:none}
.f-ink-s{stroke:var(--ink,#1A1D17);stroke-width:2;fill:none}
.f-stitch{stroke:var(--stitch,#C4552D);stroke-width:2;stroke-dasharray:7 5;fill:none}
.f-pass-s{stroke:var(--pass,#2E7A35);stroke-width:2.5;fill:none}
.f-pass{fill:var(--pass,#2E7A35)}
.f-tape{fill:var(--tape,#F5C243);stroke:var(--tape-edge,#A57710);stroke-width:1}
.f-gray{fill:var(--line-ctl,#80817A)}
.f-ink2bar{fill:var(--ink-2,#4F5149)}
.f-arrow{fill:var(--line-ctl,#80817A)}
.f-arrow-st{fill:var(--stitch,#C4552D)}
text{font-family:var(--sans,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif);fill:var(--ink,#1A1D17)}
.t-h{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:700;font-size:15px}
.t-hl{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:700;font-size:17px}
.t-b{font-size:12.5px;fill:var(--ink-2,#4F5149)}
.t-s{font-size:11.5px;fill:var(--ink-3,#65655E)}
.t-n{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.t-big{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:800;font-size:26px}
.t-pass{fill:var(--pass,#2E7A35)}
.t-st{fill:var(--stitch,#C4552D)}
.t-tape{fill:var(--tape-ink,#3A2905)}
.t-halo{stroke:var(--paper,#F7F7F4);stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
</style><defs><marker id="ledger-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrow"/></marker><marker id="ledger-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrow-st"/></marker></defs><rect class="f-bg" width="740" height="514"/>
<text x="10" y="24" class="t-hl t-pass" text-anchor="start">Shipped</text>
<text x="380" y="24" class="t-hl" text-anchor="start">Tried and not shipped</text>
<path d="M10 42H360" class="f-rule"/>
<path d="M12 60l5 5l10 -11" class="f-pass-s"/>
<text x="36" y="63" class="t-h" text-anchor="start">Open-weight prescreen</text>
<text x="36" y="80" class="t-s" text-anchor="start">agreed with Muse Spark 1.3 on 34 of 34</text>
<path d="M10 88H360" class="f-rule"/>
<path d="M12 106l5 5l10 -11" class="f-pass-s"/>
<text x="36" y="109" class="t-h" text-anchor="start">Resend history each turn</text>
<text x="36" y="126" class="t-s" text-anchor="start">1–7 s a turn instead of 11–25 s</text>
<path d="M10 134H360" class="f-rule"/>
<path d="M12 152l5 5l10 -11" class="f-pass-s"/>
<text x="36" y="155" class="t-h" text-anchor="start">Spark Open runs the sandbox agent</text>
<text x="36" y="172" class="t-s" text-anchor="start">0.92 of 1.3&#x27;s pass rate, bar 0.85</text>
<path d="M10 180H360" class="f-rule"/>
<path d="M12 198l5 5l10 -11" class="f-pass-s"/>
<text x="36" y="201" class="t-h" text-anchor="start">Quality formula b3.v1 → b3.v6</text>
<text x="36" y="218" class="t-s" text-anchor="start">gems stopped being 22 of 25 verified</text>
<path d="M10 226H360" class="f-rule"/>
<path d="M12 244l5 5l10 -11" class="f-pass-s"/>
<text x="36" y="247" class="t-h" text-anchor="start">Relevance shortlist, rules ranking</text>
<text x="36" y="264" class="t-s" text-anchor="start">held-out P@5 25.9% → 32.9%</text>
<path d="M10 272H360" class="f-rule"/>
<path d="M12 290l5 5l10 -11" class="f-pass-s"/>
<text x="36" y="293" class="t-h" text-anchor="start">Aimed clicks (zoom and re-aim)</text>
<text x="36" y="310" class="t-s" text-anchor="start">small controls hit 5 of 14 → 13 of 14</text>
<path d="M10 318H360" class="f-rule"/>
<path d="M12 336l5 5l10 -11" class="f-pass-s"/>
<text x="36" y="339" class="t-h" text-anchor="start">Visual-defect deduction</text>
<text x="36" y="356" class="t-s" text-anchor="start">×0.95 for app-caused defects, 186 checked</text>
<path d="M10 364H360" class="f-rule"/>
<path d="M12 382l5 5l10 -11" class="f-pass-s"/>
<text x="36" y="385" class="t-h" text-anchor="start">Known-vulnerability cap at 79</text>
<text x="36" y="402" class="t-s" text-anchor="start">hidden gems 161 → 132</text>
<path d="M10 410H360" class="f-rule"/>
<path d="M12 428l5 5l10 -11" class="f-pass-s"/>
<text x="36" y="431" class="t-h" text-anchor="start">Translation by Muse Spark Open</text>
<text x="36" y="448" class="t-s" text-anchor="start">about $0.0045 a tool, effort medium</text>
<path d="M380 42H730" class="f-rule"/>
<path d="M383 53l11 11M394 53l-11 11" class="f-line"/>
<text x="406" y="63" class="t-h" text-anchor="start">Usability scores</text>
<text x="406" y="80" class="t-s" text-anchor="start">two pre-registered rounds missed the bar</text>
<path d="M380 88H730" class="f-rule"/>
<path d="M383 99l11 11M394 99l-11 11" class="f-line"/>
<text x="406" y="109" class="t-h" text-anchor="start">Severity-based deductions</text>
<text x="406" y="126" class="t-s" text-anchor="start">second judge kept 1 of 4 real majors</text>
<path d="M380 134H730" class="f-rule"/>
<path d="M383 145l11 11M394 145l-11 11" class="f-line"/>
<text x="406" y="155" class="t-h" text-anchor="start">A longer GUI step cap</text>
<text x="406" y="172" class="t-s" text-anchor="start">60 steps rescued 0 of 12 stuck apps</text>
<path d="M380 180H730" class="f-rule"/>
<path d="M383 191l11 11M394 191l-11 11" class="f-line"/>
<text x="406" y="201" class="t-h" text-anchor="start">Spark Open for extraction</text>
<text x="406" y="218" class="t-s" text-anchor="start">62–71% field agreement, bar 90%</text>
<path d="M380 226H730" class="f-rule"/>
<path d="M383 237l11 11M394 237l-11 11" class="f-line"/>
<text x="406" y="247" class="t-h" text-anchor="start">SAM 3.1 as a click locator</text>
<text x="406" y="264" class="t-s" text-anchor="start">found 8 of 19 icons</text>
<path d="M380 272H730" class="f-rule"/>
<path d="M383 283l11 11M394 283l-11 11" class="f-line"/>
<text x="406" y="293" class="t-h" text-anchor="start">Planning agent sees the window</text>
<text x="406" y="310" class="t-s" text-anchor="start">features checked 0 vs 1 on 1.3</text>
<path d="M380 318H730" class="f-rule"/>
<path d="M383 329l11 11M394 329l-11 11" class="f-line"/>
<text x="406" y="339" class="t-h" text-anchor="start">jobs phrases for ranking</text>
<text x="406" y="356" class="t-s" text-anchor="start">no recorded result; kept on a tag</text>
<path d="M380 364H730" class="f-rule"/>
<path d="M383 375l11 11M394 375l-11 11" class="f-line"/>
<text x="406" y="385" class="t-h" text-anchor="start">Well-known reference records</text>
<text x="406" y="402" class="t-s" text-anchor="start">an unverified option shipped instead</text>
<text x="10" y="502" class="t-s" text-anchor="start">Bars for every experiment were committed before the first paid call. Unmerged code is kept as git tags under archive/.</text>
</svg>
