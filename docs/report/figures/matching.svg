</style><defs><marker id="matching-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrow"/></marker><marker id="matching-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrow-st"/></marker></defs><rect class="f-bg" width="740" height="430"/>
<path d="M14 20H202L216 34V120Q216 124 212 124H14Q10 124 10 120V24Q10 20 14 20Z" class="f-box"/>
<text x="24" y="47" class="t-h" text-anchor="start">Your need + conditions</text>
<text x="24" y="70" class="t-b" text-anchor="start">“free and offline on my</text>
<text x="24" y="86" class="t-b" text-anchor="start">Mac: subtitles from</text>
<text x="24" y="102" class="t-b" text-anchor="start">meeting recordings”</text>
<rect x="256" y="20" width="206" height="104" rx="4" class="f-box"/>
<text x="270" y="47" class="t-h" text-anchor="start">Hard filters</text>
<text x="270" y="70" class="t-b" text-anchor="start">OS, CPU, free, offline,</text>
<text x="270" y="86" class="t-b" text-anchor="start">data stays local;</text>
<text x="270" y="102" class="t-b" text-anchor="start">never relaxed</text>
<rect x="502" y="20" width="206" height="104" rx="4" class="f-box"/>
<text x="516" y="47" class="t-h" text-anchor="start">Candidate cards</text>
<text x="516" y="70" class="t-b" text-anchor="start">up to 60; for a big</text>
<text x="516" y="86" class="t-b" text-anchor="start">category, BM25 picks</text>
<text x="516" y="102" class="t-b" text-anchor="start">50 relevant + 10 gems</text>
<rect x="10" y="180" width="206" height="104" rx="4" class="f-box"/>
<text x="24" y="207" class="t-h" text-anchor="start">One Muse Spark 1.3 call</text>
<text x="24" y="230" class="t-b" text-anchor="start">picks 1–3 with reasons</text>
<text x="24" y="246" class="t-b" text-anchor="start">that cite card fields,</text>
<text x="24" y="262" class="t-b" text-anchor="start">only from candidates</text>
<rect x="256" y="180" width="206" height="104" rx="4" class="f-box"/>
<text x="270" y="207" class="t-h" text-anchor="start">Program guard</text>
<text x="270" y="230" class="t-b" text-anchor="start">drops a pick whose</text>
<text x="270" y="246" class="t-b" text-anchor="start">reason doesn&#x27;t match</text>
<text x="270" y="262" class="t-b" text-anchor="start">its record</text>
<path d="M506 180H694L708 194V280Q708 284 704 284H506Q502 284 502 280V184Q502 180 506 180Z" class="f-voice"/>
<text x="516" y="207" class="t-h" text-anchor="start">Answer</text>
<text x="516" y="230" class="t-b" text-anchor="start">picks, tradeoffs, best</text>
<text x="516" y="246" class="t-b" text-anchor="start">free option, how_we_know,</text>
<text x="516" y="262" class="t-b" text-anchor="start">evidence_url</text>
<path d="M219 72.0L253 72.0" class="f-line" marker-end="url(#matching-a)"/>
<path d="M219 232.0L253 232.0" class="f-line" marker-end="url(#matching-a)"/>
<path d="M465 72.0L499 72.0" class="f-line" marker-end="url(#matching-a)"/>
