<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" width="740" height="430" role="img" aria-labelledby="matching-t"><title id="matching-t">How find_software matches a request: hard filters, candidate cards, one model call, a guard, and a rules fallback</title><style>
