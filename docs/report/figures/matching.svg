<path d="M605.0 127V152H113.0V176" class="f-line" marker-end="url(#matching-a)"/>
<path d="M113.0 287V324" class="f-stitch" marker-end="url(#matching-s)"/>
<rect x="40" y="328" width="470" height="70" rx="4" class="f-soft"/>
<text x="54" y="352" class="t-h" text-anchor="start">Model off, over budget, slow, or every pick rejected?</text>
<text x="54" y="372" class="t-s" text-anchor="start">Rank by rules instead: BM25 plus a fixed lexicon.</text>
<text x="54" y="388" class="t-s" text-anchor="start">The answer says so: matched_by: rules, degraded: true.</text>
<path d="M513 363H605.0V288" class="f-stitch" marker-end="url(#matching-s)"/>
</svg>
