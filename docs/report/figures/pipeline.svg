<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" width="740" height="420" role="img" aria-labelledby="pipeline-t"><title id="pipeline-t">How pickfit works: discover, prescreen, read, try, replay, score, publish, answer</title><style>
.f-bg{fill:var(--paper,#F7F7F4)}
.f-box{fill:var(--raised,#FFFFFF);stroke:var(--fitz-line,#4A2E22);stroke-width:2}
.f-soft{fill:var(--raised,#FFFFFF);stroke:var(--line-ctl,#80817A);stroke-width:1}
.f-voice{fill:var(--voice,#F1F6E2);stroke:var(--voice-edge,#A9B77E);stroke-width:1}
.f-quiet{fill:var(--sunk,#F0F1EC)}
.f-rule{stroke:var(--rule,#DEDFD9);stroke-width:1;fill:none}
.f-line{stroke:var(--line-ctl,#80817A);stroke-width:1.5;fill:none}
.f-ink-s{stroke:var(--ink,#1A1D17);stroke-width:2;fill:none}
.f-stitch{stroke:var(--stitch,#C4552D);stroke-width:2;stroke-dasharray:7 5;fill:none}
.f-pass-s{stroke:var(--pass,#2E7A35);stroke-width:2.5;fill:none}
.f-pass{fill:var(--pass,#2E7A35)}
.f-tape{fill:var(--tape,#F5C243);stroke:var(--tape-edge,#A57710);stroke-width:1}
.f-gray{fill:var(--line-ctl,#80817A)}
.f-ink2bar{fill:var(--ink-2,#4F5149)}
.f-arrow{fill:var(--line-ctl,#80817A)}
.f-arrow-st{fill:var(--stitch,#C4552D)}
text{font-family:var(--sans,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif);fill:var(--ink,#1A1D17)}
.t-h{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:700;font-size:15px}
.t-hl{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:700;font-size:17px}
.t-b{font-size:12.5px;fill:var(--ink-2,#4F5149)}
.t-s{font-size:11.5px;fill:var(--ink-3,#65655E)}
.t-n{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.t-big{font-family:var(--display,"Bricolage Grotesque",system-ui,sans-serif);font-weight:800;font-size:26px}
.t-pass{fill:var(--pass,#2E7A35)}
.t-st{fill:var(--stitch,#C4552D)}
.t-tape{fill:var(--tape-ink,#3A2905)}
.t-halo{stroke:var(--paper,#F7F7F4);stroke-width:5px;stroke-linejoin:round;paint-order:stroke}
</style><defs><marker id="pipeline-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrow"/></marker><marker id="pipeline-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-arrow-st"/></marker></defs><rect class="f-bg" width="740" height="420"/>
<rect x="10" y="24" width="152" height="132" rx="4" class="f-box"/>
<text x="24" y="50" class="t-h" text-anchor="start">1  Discover</text>
<text x="24" y="71" class="t-b" text-anchor="start">GitHub, Show HN,</text>
<text x="24" y="87" class="t-b" text-anchor="start">Flathub, Homebrew</text>
<text x="24" y="103" class="t-b" text-anchor="start">Cask, the web and</text>
<text x="24" y="119" class="t-b" text-anchor="start">submissions</text>
<text x="24" y="144" class="t-s t-st" text-anchor="start">no model</text>
<path d="M165 90.0L183 90.0" class="f-line" marker-end="url(#pipeline-a)"/>
<rect x="186" y="24" width="152" height="132" rx="4" class="f-box"/>
<text x="200" y="50" class="t-h" text-anchor="start">2  Prescreen</text>
<text x="200" y="71" class="t-b" text-anchor="start">Rules drop forks,</text>
<text x="200" y="87" class="t-b" text-anchor="start">libraries, templates;</text>
<text x="200" y="103" class="t-b" text-anchor="start">a model makes the</text>
<text x="200" y="119" class="t-b" text-anchor="start">first cut</text>
<text x="200" y="144" class="t-s" text-anchor="start">Muse Spark Open</text>
<path d="M341 90.0L359 90.0" class="f-line" marker-end="url(#pipeline-a)"/>
<rect x="362" y="24" width="152" height="132" rx="4" class="f-box"/>
<text x="376" y="50" class="t-h" text-anchor="start">3  Read</text>
<text x="376" y="71" class="t-b" text-anchor="start">Facts from the</text>
<text x="376" y="87" class="t-b" text-anchor="start">README, each with</text>
<text x="376" y="103" class="t-b" text-anchor="start">a quote the code</text>
<text x="376" y="119" class="t-b" text-anchor="start">checks</text>
<text x="376" y="144" class="t-s" text-anchor="start">Muse Spark 1.3</text>
<path d="M517 90.0L535 90.0" class="f-line" marker-end="url(#pipeline-a)"/>
<rect x="538" y="24" width="152" height="132" rx="4" class="f-box"/>
<text x="552" y="50" class="t-h" text-anchor="start">4  Try</text>
<text x="552" y="71" class="t-b" text-anchor="start">An agent installs</text>
<text x="552" y="87" class="t-b" text-anchor="start">and uses it in a</text>
<text x="552" y="103" class="t-b" text-anchor="start">fresh sandbox; a</text>
<text x="552" y="119" class="t-b" text-anchor="start">judge checks it</text>
<text x="552" y="144" class="t-s" text-anchor="start">Spark Open + 1.3</text>
<rect x="10" y="224" width="152" height="132" rx="4" class="f-box"/>
<text x="24" y="250" class="t-h" text-anchor="start">5  Replay</text>
<text x="24" y="271" class="t-b" text-anchor="start">A new sandbox</text>
<text x="24" y="287" class="t-b" text-anchor="start">reruns the steps,</text>
<text x="24" y="303" class="t-b" text-anchor="start">then the network</text>
<text x="24" y="319" class="t-b" text-anchor="start">is cut</text>
<text x="24" y="344" class="t-s t-st" text-anchor="start">no model</text>
<path d="M165 290.0L183 290.0" class="f-line" marker-end="url(#pipeline-a)"/>
<rect x="186" y="224" width="152" height="132" rx="4" class="f-box"/>
<text x="200" y="250" class="t-h" text-anchor="start">6  Score</text>
<text x="200" y="271" class="t-b" text-anchor="start">Quality, popularity,</text>
<text x="200" y="287" class="t-b" text-anchor="start">gem, known</text>
<text x="200" y="303" class="t-b" text-anchor="start">vulnerabilities,</text>
<text x="200" y="319" class="t-b" text-anchor="start">visual defects</text>
<text x="200" y="344" class="t-s" text-anchor="start">rules, 1.3, OSV, Wonder</text>
<path d="M341 290.0L359 290.0" class="f-line" marker-end="url(#pipeline-a)"/>
<rect x="362" y="224" width="152" height="132" rx="4" class="f-box"/>
<text x="376" y="250" class="t-h" text-anchor="start">7  Publish</text>
<text x="376" y="271" class="t-b" text-anchor="start">Schema check,</text>
<text x="376" y="287" class="t-b" text-anchor="start">index, deploy to</text>
<text x="376" y="303" class="t-b" text-anchor="start">the Worker</text>
<text x="376" y="344" class="t-s" text-anchor="start">Cloudflare</text>
<path d="M517 290.0L535 290.0" class="f-line" marker-end="url(#pipeline-a)"/>
<path d="M542 224H676L690 238V352Q690 356 686 356H542Q538 356 538 352V228Q538 224 542 224Z" class="f-voice"/>
<text x="552" y="250" class="t-h" text-anchor="start">8  Answer</text>
<text x="552" y="271" class="t-b" text-anchor="start">MCP for agents,</text>
<text x="552" y="287" class="t-b" text-anchor="start">pickfit.app for</text>
<text x="552" y="303" class="t-b" text-anchor="start">people, each with</text>
<text x="552" y="319" class="t-b" text-anchor="start">how we know</text>
<text x="552" y="344" class="t-s" text-anchor="start">Spark 1.3 matches</text>
<path d="M614.0 159V204H86.0V220" class="f-line" marker-end="url(#pipeline-a)"/>
<path d="M692 290.0H726V90.0H694" class="f-stitch" marker-end="url(#pipeline-s)"/>
<text x="720" y="176" class="t-s t-st" text-anchor="end">a real failure</text>
<text x="720" y="190" class="t-s t-st" text-anchor="end">report → rerun</text>
<text x="10" y="406" class="t-s" text-anchor="start">Only steps that passed in step 4 and again in step 5 are shown to users. Anything else says “not verified” and why.</text>
</svg>
